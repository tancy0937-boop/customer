/* ---- board drag controller (touch + mouse, iPad-safe) ---- */
function bindBoard(){
  const b=document.getElementById("board");
  if(!b || b.dataset.bound) return;
  b.dataset.bound="1";
  b.addEventListener("touchstart", bdDown, {passive:false});
  b.addEventListener("touchmove", bdMove, {passive:false});
  b.addEventListener("touchend", bdUp);
  b.addEventListener("touchcancel", bdUp);
  b.addEventListener("mousedown", bdDown);
}
function bdDown(e){
  const card=e.target.closest && e.target.closest(".kcard");
  if(!card) return;
  const pt=e.touches?e.touches[0]:e;
  bd={card, id:card.dataset.id, from:+card.dataset.step, sx:pt.clientX, sy:pt.clientY,
      lastX:pt.clientX, lastY:pt.clientY, dragging:false, tap:true, drop:null, lp:null, ghost:null, raf:null, off:{x:0,y:0}};
  if(e.type==="mousedown"){ window.addEventListener("mousemove", bdMove); window.addEventListener("mouseup", bdUp); }
  else { bd.lp=setTimeout(()=>{ const p={clientX:bd.lastX, clientY:bd.lastY}; bdStart(p); }, 200); }
}
function bdStart(pt){
  if(!bd) return;
  bd.dragging=true; bd.tap=false;
  const r=bd.card.getBoundingClientRect();
  bd.off.x=pt.clientX-r.left; bd.off.y=pt.clientY-r.top;
  const g=bd.card.cloneNode(true);
  g.className="kcard kghost";
  g.style.width=r.width+"px";
  g.style.left=(pt.clientX-bd.off.x)+"px";
  g.style.top=(pt.clientY-bd.off.y)+"px";
  document.body.appendChild(g);
  bd.ghost=g;
  bd.card.classList.add("dragging");
  document.body.style.userSelect="none";
  try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){}
  bdAuto();
}
function bdMove(e){
  if(!bd) return;
  const pt=e.touches?e.touches[0]:e;
  bd.lastX=pt.clientX; bd.lastY=pt.clientY;
  if(!bd.dragging){
    const dx=Math.abs(pt.clientX-bd.sx), dy=Math.abs(pt.clientY-bd.sy);
    if(e.type==="mousemove"){ if(dx>5||dy>5) bdStart(pt); }
    else if(dx>10||dy>10){ clearTimeout(bd.lp); bd.tap=false; }  // treat as scroll
    return;
  }
  if(e.cancelable) e.preventDefault();
  bd.ghost.style.left=(pt.clientX-bd.off.x)+"px";
  bd.ghost.style.top=(pt.clientY-bd.off.y)+"px";
  bd.ghost.style.visibility="hidden";
  let under=null; try{ under=document.elementFromPoint(pt.clientX, pt.clientY); }catch(_){}
  bd.ghost.style.visibility="";
  const col=(under&&under.closest)?under.closest(".kcol"):null;
  if(col!==bd.drop){ if(bd.drop) bd.drop.classList.remove("drop"); bd.drop=col; if(col) col.classList.add("drop"); }
}
function bdUp(){
  if(!bd) return;
  if(bd.lp) clearTimeout(bd.lp);
  window.removeEventListener("mousemove", bdMove);
  window.removeEventListener("mouseup", bdUp);
  if(bd.dragging){
    const target=bd.drop;
    if(bd.ghost) bd.ghost.remove();
    if(bd.card) bd.card.classList.remove("dragging");
    document.body.style.userSelect="";
    document.querySelectorAll(".kcol.drop").forEach(c=>c.classList.remove("drop"));
    if(bd.raf) cancelAnimationFrame(bd.raf);
    if(target){ const ns=+target.dataset.step; if(ns!==bd.from) bdMoveCard(bd.card, target, ns); }
  } else if(bd.tap){
    openDetail(bd.id);
  }
  bd=null;
}
function bdMoveCard(card, col, ns){
  const fromCol=card.closest(".kcol");
  col.querySelector(".kcol-body").appendChild(card);
  card.dataset.step=ns;
  const c=DB.clients.find(x=>x.id===card.dataset.id);
  if(c){ c.sopStep=ns; commit(); }
  [fromCol,col].forEach(refreshCol);
  toast("已移到 "+ns+". "+SOP[ns-1].short);
}
function refreshCol(col){
  if(!col) return;
  const body=col.querySelector(".kcol-body");
  const n=body.querySelectorAll(".kcard").length;
  col.querySelector(".kcol-head .c").textContent=n;
  let empty=body.querySelector(".kempty");
  if(n===0 && !empty){ const e=document.createElement("div"); e.className="kempty"; e.textContent="拖曳客戶到此"; body.appendChild(e); }
  if(n>0 && empty) empty.remove();
}
function bdAuto(){
  if(!bd || !bd.dragging) return;
  const b=document.getElementById("board");
  if(b){
    const r=b.getBoundingClientRect(); const edge=58, sp=16;
    if(bd.lastX<r.left+edge) b.scrollLeft-=sp;
    else if(bd.lastX>r.right-edge) b.scrollLeft+=sp;
    if(bd.drop){ const body=bd.drop.querySelector(".kcol-body"); if(body){ const br=body.getBoundingClientRect();
      if(bd.lastY<br.top+edge) body.scrollTop-=sp; else if(bd.lastY>br.bottom-edge) body.scrollTop+=sp; } }
  }
  bd.raf=requestAnimationFrame(bdAuto);
}

/* ---- reminders view ---- */
const MONTHNAMES=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const WEEKDAYS=["日","一","二","三","四","五","六"];
const EVTYPE={bday:["生日","t-bday"],pay:["繳費","t-pay"],mat:["滿期","t-mat"],visit:["複訪","t-visit"],care:["關懷","t-care"],manual:["待辦","t-manual"],google:["Google","t-google"]};

function viewReminders(){
  if(calY==null){ const t=new Date(); calY=t.getFullYear(); calM=t.getMonth(); }
  const icCal=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 2.5v4M16 2.5v4" stroke-linecap="round"/></svg>`;
  const icList=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" stroke-linecap="round"/></svg>`;
  let head=`<div class="viewhead"><h2>行事曆</h2>
    <div class="spacer"></div>
    <div class="cmode">
      <button class="${calMode==="month"?"on":""}" onclick="setCalMode('month')">${icCal}月曆</button>
      <button class="${calMode==="list"?"on":""}" onclick="setCalMode('list')">${icList}待辦</button>
    </div></div>`;
  return head + (calMode==="list"? reminderListBody() : monthGridBody());
}
function setCalMode(m){ calMode=m; render(); }
function calShift(d){ calM+=d; if(calM<0){calM=11;calY--;} if(calM>11){calM=0;calY++;} render(); }
function calToday(){ const t=new Date(); calY=t.getFullYear(); calM=t.getMonth(); render(); }

function monthGridBody(){
  const t=todayISO();
  if(gcalIsConnected()) gcalFetchMonth(calY,calM);
  const gkey=`${calY}-${calM}`;
  const gevs=(gcalIsConnected() && gcalEventsCache[gkey])? gcalEventsCache[gkey].map(g=>({date:g.date,type:"google",title:g.title,who:g.time?`${g.time} ${g.title}`:g.title})) : [];
  const ev=eventsInMonth(calY,calM).concat(gevs);
  const byDay={}; ev.forEach(e=>{ const d=+e.date.split("-")[2]; (byDay[d]=byDay[d]||[]).push(e); });
  const order={mat:0,bday:1,visit:2,pay:3,manual:4,care:5,google:6};
  Object.values(byDay).forEach(a=>a.sort((x,y)=>(order[x.type]??9)-(order[y.type]??9)));
  const firstDow=new Date(calY,calM,1).getDay();
  const daysIn=new Date(calY,calM+1,0).getDate();
  const prevDays=new Date(calY,calM,0).getDate();
  const cells=[];
  for(let i=0;i<42;i++){
    const dayNum=i-firstDow+1;
    let inMonth=true, n=dayNum, cy=calY, cm=calM;
    if(dayNum<1){ inMonth=false; n=prevDays+dayNum; cm=calM-1; if(cm<0){cm=11;cy--;} }
    else if(dayNum>daysIn){ inMonth=false; n=dayNum-daysIn; cm=calM+1; if(cm>11){cm=0;cy++;} }
    const iso=`${cy}-${pad(cm+1)}-${pad(n)}`;
    const evs=inMonth?(byDay[n]||[]):[];
    const isToday=iso===t;
    const dow=i%7;
    let chips="";
    if(evs.length){
      chips=evs.slice(0,3).map(e=>{ const [,tc]=EVTYPE[e.type]||["",""]; return `<div class="calchip ${tc}">${esc(e.who||e.title)}</div>`; }).join("");
      if(evs.length>3) chips+=`<div class="calmore">+${evs.length-3}</div>`;
    }
    cells.push(`<div class="calcell ${inMonth?"":"out"} ${isToday?"today":""}" onclick="${inMonth?`openDay('${iso}')`:""}">
      <div class="dn ${dow===0?"sun":""}">${n}</div>${chips}</div>`);
  }
  // legend
  const legendKeys=[["mat","滿期"],["bday","生日"],["pay","繳費"],["visit","複訪"]];
  if(gcalIsConnected()) legendKeys.push(["google","Google"]);
  const legend=legendKeys.map(([k,l])=>{const[,tc]=EVTYPE[k];return `<span class="leg"><i class="${tc}"></i>${l}</span>`;}).join("");
  const gcalBadge=gcalIsConnected()
    ? `<span class="gcalstatus on" title="已連接 Google 行事曆">🔗 Google 已連動</span>`
    : `<span class="gcalstatus" onclick="go('guide')" title="點此前往設定連接">🔗 未連接 Google</span>`;
  return `<div class="calbar">
      <button class="calnav" onclick="calShift(-1)">‹</button>
      <div class="mtitle">${calY} 年 ${MONTHNAMES[calM]}</div>
      <button class="calnav" onclick="calShift(1)">›</button>
      <button class="caltoday" onclick="calToday()">今天</button>
      <button class="tb-btn primary" style="height:38px;color:#241A06" onclick="scheduleVisit(null,null)">＋ 複訪</button>
    </div>
    <div class="calgrid">
      <div class="calhead">${WEEKDAYS.map((d,i)=>`<div class="${i===0?"sun":""}">${d}</div>`).join("")}</div>
      <div class="calweeks">${cells.join("")}</div>
    </div>
    <div class="callegend">${legend}</div>
    <div style="text-align:center;margin-top:8px">${gcalBadge}</div>`;
}

function openDay(iso){
  const [y,m,d]=iso.split("-").map(Number);
  const evs=eventsInMonth(y,m-1).filter(e=>e.date===iso);
  const order={mat:0,bday:1,visit:2,pay:3,manual:4,care:5};
  evs.sort((a,b)=>(order[a.type]??9)-(order[b.type]??9));
  const gkey=`${y}-${m-1}`;
  const gevs=(gcalIsConnected() && gcalEventsCache[gkey])? gcalEventsCache[gkey].filter(g=>g.date===iso) : [];
  const wd=WEEKDAYS[new Date(iso).getDay()];
  const localRows = evs.length? evs.map(e=>{
    const [tl,tc]=EVTYPE[e.type]||["",""];
    const isVisit=e.type==="visit"&&e.id;
    const canEdit=(e.type==="visit"||e.type==="manual")&&e.id;
    const vc=isVisit? DB.clients.find(x=>x.id===e.clientId) : null;
    const vr=vc? (vc.reminders||[]).find(x=>x.id===e.id) : null;
    const clickAction=isVisit?`editVisit('${e.clientId}','${e.id}')`:`openDetail('${e.clientId}')`;
    const timeLabel=(vr&&vr.startTime)? `${vr.startTime}${vr.endTime?"–"+vr.endTime:""} ・ ` : "";
    return `<div class="remitem" onclick="${clickAction}" style="cursor:pointer">
      <span class="type ${tc}" style="flex:none">${tl}</span>
      <div class="body"><div class="t">${esc(e.title)}</div><div class="who">${esc(timeLabel)}${esc(e.who)}</div></div>
      ${canEdit?`<button class="checkbtn" title="完成" onclick="event.stopPropagation();doneEvent('${e.clientId}','${e.id}','${iso}')">✓</button>
        ${isVisit?"":`<button class="checkbtn" title="刪除" style="border-color:var(--danger-soft);color:var(--danger)" onclick="event.stopPropagation();delEvent('${e.clientId}','${e.id}','${iso}')">×</button>`}`:""}
    </div>`;
  }).join("") : "";
  const gRows = gevs.length? gevs.map(g=>`
    <div class="remitem">
      <span class="type t-google" style="flex:none">Google</span>
      <div class="body"><div class="t">${esc(g.title)}</div><div class="who">${g.allDay?"全天":esc(g.time)}</div></div>
    </div>`).join("") : "";
  const rows = (localRows+gRows) || `<div style="color:var(--faint);font-size:14px;text-align:center;padding:18px 0">這天沒有排程</div>`;
  openSheet(`${m}月${d}日（${wd}）`, `${rows}
    <button class="btn green full" style="margin-top:14px" onclick="scheduleVisit('${iso}',null)">＋ 在這天排複訪</button>`);
}

function scheduleVisit(presetDate, presetCid){
  if(DB.clients.length===0){ toast("請先新增客戶","warn"); return; }
  const opts=DB.clients.slice().sort((a,b)=>(a.name||"").localeCompare(b.name||"","zh-Hant"))
    .map(c=>`<option value="${c.id}" ${c.id===presetCid?"selected":""}>${esc(c.name)}</option>`).join("");
  openSheet("排複訪", `
    <div class="field"><label>客戶</label><select id="vCid">${opts}</select></div>
    ${dateFieldHtml("vDate", presetDate||todayISO(), "日期")}
    <div class="row2">
      <div class="field"><label>預定開始時間（選填）</label><input type="time" id="vStart"></div>
      <div class="field"><label>預定結束時間（選填）</label><input type="time" id="vEnd"></div>
    </div>
    <div class="field"><label>備註（選填）</label><input id="vNote" placeholder="例：保單健檢、送資料、加保討論"></div>
    <button class="btn green full" onclick="saveVisit()">排入行事曆</button>`);
}
function saveVisit(){
  const cid=$("#vCid").value; const c=DB.clients.find(x=>x.id===cid); if(!c) return;
  const date=$("#vDate").value; if(!date){ toast("請選日期","warn"); return; }
  const startTime=($("#vStart")||{}).value||"";
  const endTime=($("#vEnd")||{}).value||"";
  const note=$("#vNote").value.trim();
  c.reminders=c.reminders||[];
  const rid=uid();
  const title=note?("複訪："+note):"複訪";
  c.reminders.push({id:rid, date, title, kind:"visit", note, startTime, endTime, done:false});
  commit(); closeSheet();
  if(view==="reminders"){ render(); } else { go("reminders"); }
  toast(gcalIsConnected()&&gcalPushEnabled()?"已排入行事曆，同步至 Google…":"已排入行事曆");
  gcalPushVisit(cid, rid, `${title}（${c.name||""}）`, date, note, startTime, endTime);
}
function editVisit(cid,id){
  const c=DB.clients.find(x=>x.id===cid); if(!c) return;
  const r=(c.reminders||[]).find(x=>x.id===id); if(!r) return;
  openSheet("編輯複訪", `
    <div class="field"><label>客戶</label><input value="${esc(c.name||"")}" disabled></div>
    ${dateFieldHtml("vEditDate", r.date||todayISO(), "日期")}
    <div class="row2">
      <div class="field"><label>預定開始時間（選填）</label><input type="time" id="vEditStart" value="${esc(r.startTime||"")}"></div>
      <div class="field"><label>預定結束時間（選填）</label><input type="time" id="vEditEnd" value="${esc(r.endTime||"")}"></div>
    </div>
    <div class="field"><label>備註</label><input id="vEditNote" value="${esc(r.note||"")}" placeholder="例：保單健檢、送資料、加保討論"></div>
    <button class="btn green full" onclick="saveVisitEdit('${cid}','${id}')">儲存變更</button>
    <button class="btn ghost full" style="margin-top:10px;color:var(--danger);border-color:var(--danger-soft)" onclick="delEvent('${cid}','${id}')">🗑 刪除這筆複訪</button>`);
}
function saveVisitEdit(cid,id){
  const c=DB.clients.find(x=>x.id===cid); if(!c) return;
  const r=(c.reminders||[]).find(x=>x.id===id); if(!r) return;
  r.date=($("#vEditDate")||{}).value||r.date;
  r.startTime=($("#vEditStart")||{}).value||"";
  r.endTime=($("#vEditEnd")||{}).value||"";
  r.note=($("#vEditNote")||{}).value.trim();
  r.title=r.note?("複訪："+r.note):"複訪";
  commit(); closeSheet(); render();
  toast("已更新複訪");
  if(r.gcalEventId) gcalUpdateVisitEvent(r, c.name);
}
function doneEvent(cid,id,iso){
  const c=DB.clients.find(x=>x.id===cid); if(!c) return;
  const r=(c.reminders||[]).find(x=>x.id===id);
  if(r){ r.done=true; if(r.gcalEventId){ gcalDeleteEvent(r.gcalEventId, r.gcalCalId); r.gcalEventId=null; r.gcalCalId=null; } commit(); render(); if(iso) openDay(iso); toast("已完成"); }
}
function delEvent(cid,id,iso){
  const c=DB.clients.find(x=>x.id===cid); if(!c) return;
  const r=(c.reminders||[]).find(x=>x.id===id);
  if(r && r.gcalEventId) gcalDeleteEvent(r.gcalEventId, r.gcalCalId);
  c.reminders=(c.reminders||[]).filter(x=>x.id!==id); commit(); render(); if(iso) openDay(iso); toast("已刪除");
}

function reminderListBody(){
  const rs=allReminders();
  const t=todayISO();
  const w=new Date(); w.setDate(w.getDate()+7); const week=w.toLocaleDateString("sv");
  const groups={over:[],today:[],week:[],later:[]};
  rs.forEach(r=>{ if(r.date<t) groups.over.push(r); else if(r.date===t) groups.today.push(r); else if(r.date<=week) groups.week.push(r); else groups.later.push(r); });
  if(rs.length===0) return `<div class="empty"><div class="big">🌿</div><h3>目前沒有排程</h3><p>填入客戶生日與保單日期會自動排程；也可在月曆上排複訪。</p>
    <button class="btn amber" style="margin-top:6px" onclick="scheduleVisit(null,null)">＋ 排複訪</button></div>`;
  const item=r=>{
    const [tl,tc]=EVTYPE[r.type]||["",""];
    const [,mm,dd]=r.date.split("-");
    const over=r.date<t;
    const dn = r.date===t? "今天" : (over? `逾 ${Math.abs(daysBetween(r.date,t))} 天` : `${daysBetween(t,r.date)} 天後`);
    const isVisit=r.type==="visit"&&r.id;
    const canEdit=(r.type==="visit"||r.type==="manual")&&r.id;
    const clickAction=isVisit?`editVisit('${r.clientId}','${r.id}')`:`openDetail('${r.clientId}')`;
    const timeLabel=(isVisit&&r.startTime)? `${r.startTime}${r.endTime?"–"+r.endTime:""} ・ ` : "";
    return `<div class="remitem ${over?"over":""}" onclick="${clickAction}">
      <div class="date"><b>${dd}</b>${mm}月</div>
      <div class="body"><div class="t">${esc(r.title)}</div><div class="who">${esc(timeLabel)}${esc(r.who)} ・ ${dn}</div></div>
      <span class="type ${tc}">${tl}</span>
      ${canEdit?`<button class="checkbtn" onclick="event.stopPropagation();doneEvent('${r.clientId}','${r.id}')">✓</button>`:""}
    </div>`;
  };
  const grp=(key,label,cls="")=> groups[key].length? `<div class="remgroup ${cls}"><h4>${label} <span class="mono" style="opacity:.7">${groups[key].length}</span></h4>${groups[key].map(item).join("")}</div>`:"";
  return grp("over","逾期","over") + grp("today","今天") + grp("week","本週內") + grp("later","之後");
}
function doneReminder(cid,rid){
  const c=DB.clients.find(x=>x.id===cid); if(!c) return;
  const r=(c.reminders||[]).find(x=>x.id===rid); if(r){ r.done=true; commit(); render(); toast("已完成"); }
}

function viewClaims(){
  const list=[];
  DB.clients.forEach(c=>(c.claims||[]).forEach(cl=>list.push(Object.assign({clientId:c.id,who:c.name},cl))));
  list.sort((a,b)=> (b.date||"").localeCompare(a.date||""));
  const open=list.filter(x=>x.status!=="已結案").length;
  let head=`<div class="viewhead"><h2>理賠</h2><span class="count mono">${list.length}</span>
    ${open?`<span class="count" style="color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)">處理中 ${open}</span>`:""}</div>`;

  const statusColor=s=> s==="已結案"?"var(--ok)": s==="送件中"?"var(--amber)":"var(--muted)";
  return head+`<div class="clientgrid">${list.map(cl=>`

function viewGrades(){
  const by={A:[],B:[],C:[],D:[],"":[]};
  DB.clients.forEach(c=>by[c.grade].push(c));
  const totalDesk=DB.clients.filter(c=>c.giftDesk).length;
  const totalWall=DB.clients.filter(c=>c.giftWall).length;
  const totalOther=DB.clients.filter(c=>c.giftOther).length;
  let html=`<div class="viewhead"><h2>客戶分級</h2><span class="count mono">${DB.clients.length}</span></div>
    <div class="info" style="padding:14px 16px"><p style="margin:0;font-size:13.5px;color:var(--muted)">SOP 步驟 6–8：把客戶分為 A／B／C／D 級，A 級重點維繫，BCD 級當作潛力名單節奏經營。</p></div>

      <div class="giftsummary-row">
        <span class="giftitem">🖥️ 桌曆<b>${totalDesk}</b></span>
        <span class="giftitem">📅 月曆<b>${totalWall}</b></span>
        <span class="giftitem">➕ 其他<b>${totalOther}</b></span>
      </div>
    </div>`:""}`;
  const block=(g)=>{
    const arr=by[g]; const meta=GRADES[g];
    const gc=g?("g-"+g):"g-none";
    const gDesk=arr.filter(c=>c.giftDesk).length;
    const gWall=arr.filter(c=>c.giftWall).length;
    const gOther=arr.filter(c=>c.giftOther).length;
    return `<div class="block">
      <h4><span class="gradebadge ${gc}">${g||"–"}</span> ${meta.label}・${meta.note}<span class="tag">${arr.length} 位</span></h4>
      ${g&&(DB.meta.gradeDefs||DEFAULT_GRADE_DEFS)[g]?`<div class="giftsubtotal" style="border-bottom:1px solid var(--line-2)">${esc((DB.meta.gradeDefs||DEFAULT_GRADE_DEFS)[g])}</div>`:""}
      ${(gDesk||gWall||gOther)?`<div class="giftsubtotal">🎁 本級小計：桌曆 ${gDesk}・月曆 ${gWall}・其他 ${gOther}</div>`:""}
      ${arr.length? `<div class="block-body" style="padding:8px 10px">${arr.map(c=>{
        const gifts=[c.giftDesk?"🖥️桌曆":"",c.giftWall?"📅月曆":"",c.giftOther?`➕其他${c.giftOtherText?"："+esc(c.giftOtherText):""}`:""].filter(Boolean).join("　");
        return `
        <div class="kv" style="cursor:pointer;align-items:center" onclick="openDetail('${c.id}')">
          <span class="k" style="color:var(--ink);font-weight:600">${esc(c.name)}</span>
          <span class="v" style="font-weight:500;color:var(--muted)">${(c.policies||[]).length} 張保單 ・ SOP ${c.sopStep}</span>
        </div>
        ${gifts?`<div style="font-size:12px;color:var(--muted);padding:0 0 8px">${gifts}</div>`:""}`;
      }).join("")}</div>`
      : `<div class="block-body" style="color:var(--faint);font-size:13px">此級別尚無客戶</div>`}
    </div>`;
  };
  return html + ["A","B","C","D",""].map(block).join("");
}

function saveSettings(){

/* ---- SOP flow editor ---- */
let _sopEdit=null;
function openGradeDefEditor(){
  openSheet("編輯分級定義", `
    <p style="font-size:13px;color:var(--muted);margin:0 0 14px">調整 A／B／C／D 各級的判定標準文字，會顯示在客戶編輯畫面與客戶分級頁，方便對照、避免標準不一致。這段文字只是說明，系統的自動判定邏輯（保單張數／轉介數門檻）不會因為改了文字而改變。</p>
    ${["A","B","C","D"].map(g=>`<div class="field"><label>${g} 級定義</label><textarea id="gdEdit${g}" style="min-height:70px">${esc((DB.meta.gradeDefs||DEFAULT_GRADE_DEFS)[g])}</textarea></div>`).join("")}
    <button class="btn green full" onclick="saveGradeDefs()">儲存</button>
    <button class="btn ghost full" style="margin-top:10px" onclick="resetGradeDefs()">恢復預設文字</button>
  `);
}
function saveGradeDefs(){
  DB.meta.gradeDefs = DB.meta.gradeDefs||{};
  ["A","B","C","D"].forEach(g=>{ DB.meta.gradeDefs[g] = (($(`#gdEdit${g}`)||{}).value||"").trim() || DEFAULT_GRADE_DEFS[g]; });
  commit(); closeSheet();
  toast("已儲存分級定義");
  render();
}
function resetGradeDefs(){
  DB.meta.gradeDefs = Object.assign({}, DEFAULT_GRADE_DEFS);
  commit(); closeSheet();
  toast("已恢復預設分級定義");
  render();
}
function resetAllGradesToAuto(){
  openSheet("全部改為系統自動判定", `
    <p style="font-size:14px;line-height:1.7">確定要把「所有客戶」的分級都改回系統自動判定嗎？目前手動設定過的分級也會一併被系統重新計算覆蓋。之後你仍可以隨時針對個別客戶手動調整分級。</p>
    <div class="btnrow" style="margin-top:16px">
      <button class="btn ghost" onclick="closeSheet()">取消</button>
      <button class="btn green" onclick="doResetAllGradesToAuto()">確定全部改為自動</button>
    </div>
  `);
}
function doResetAllGradesToAuto(){
  DB.clients.forEach(c=>{ c.gradeAuto=true; });
  const n=DB.clients.length;
  commit(); closeSheet();
  toast(`已將 ${n} 位客戶改為系統自動判定`);
  render();
}
function openSopEditor(){
  _sopEdit = SOP.map(s=>({title:s.title, short:s.short, desc:s.desc}));
  renderSopEditor();
}
function renderSopEditor(){
  const rows=_sopEdit.map((s,i)=>`
    <div class="subcard">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px">
        <span style="width:26px;height:26px;border-radius:8px;background:var(--pine);color:#fff;font-family:var(--mono);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none">${i+1}</span>
        <input value="${esc(s.title)}" oninput="sopSet(${i},'title',this.value)" placeholder="步驟名稱" style="flex:1;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px">
        <button class="sopmini" onclick="sopMove(${i},-1)" ${i===0?"disabled":""}>↑</button>
        <button class="sopmini" onclick="sopMove(${i},1)" ${i===_sopEdit.length-1?"disabled":""}>↓</button>
        <button class="sopmini del" onclick="sopDel(${i})">×</button>
      </div>
      <div class="field" style="margin-bottom:8px"><label>短標（看板欄位／卡片顯示，2–3 字）</label>
        <input value="${esc(s.short)}" oninput="sopSet(${i},'short',this.value)" placeholder="例：需求" maxlength="6"></div>
      <div class="field" style="margin-bottom:0"><label>說明（選填）</label>
        <textarea oninput="sopSet(${i},'desc',this.value)" placeholder="這個階段要做什麼…" style="min-height:52px">${esc(s.desc)}</textarea></div>
    </div>`).join("");
  openSheet("自訂 SOP 流程", `
    <p style="font-size:13px;color:var(--muted);margin:0 0 14px">
      依你的銷售邏輯調整每個階段。改完後，看板、進度條、客戶頁、行事曆都會套用這套流程。（${_sopEdit.length} 個步驟，可 3–10 個）
    </p>
    ${rows}
    ${_sopEdit.length<10?`<button class="addrow" onclick="sopAdd()">＋ 新增步驟</button>`:`<p style="font-size:12px;color:var(--muted);text-align:center">已達上限 10 個步驟</p>`}
    <div class="btnrow" style="margin-top:16px">
      <button class="btn ghost" style="flex:1" onclick="sopResetDefault()">還原預設</button>
      <button class="btn green" style="flex:2" onclick="sopSave()">儲存流程</button>
    </div>
    <p style="font-size:12px;color:var(--muted);margin-top:10px">建議在開始建立客戶前設定好；日後大幅調整順序，可能改變既有客戶目前所在的階段對應。</p>`);
}
function sopSet(i,k,v){ if(_sopEdit[i]) _sopEdit[i][k]=v; }
function sopMove(i,d){ const j=i+d; if(j<0||j>=_sopEdit.length) return; const t=_sopEdit[i]; _sopEdit[i]=_sopEdit[j]; _sopEdit[j]=t; renderSopEditor(); }
function sopDel(i){ if(_sopEdit.length<=3){ toast("至少要保留 3 個步驟","warn"); return; } _sopEdit.splice(i,1); renderSopEditor(); }
function sopAdd(){ if(_sopEdit.length>=10){ toast("最多 10 個步驟","warn"); return; } _sopEdit.push({title:"新步驟",short:"新",desc:""}); renderSopEditor(); }
function sopResetDefault(){ _sopEdit=DEFAULT_SOP.map(s=>({title:s.title,short:s.short,desc:s.desc})); renderSopEditor(); toast("已載入預設流程（尚未儲存）"); }
function sopSave(){
  for(const s of _sopEdit){ if(!(s.title||"").trim()){ toast("每個步驟都要有名稱","warn"); return; } }
  DB.meta.sop=_sopEdit.map(s=>({title:(s.title||"").trim(), short:((s.short||"").trim()||(s.title||"").trim().slice(0,3)), desc:(s.desc||"").trim()}));
  loadSOP();
  DB.clients.forEach(c=>{ if(!c.sopStep||c.sopStep<1) c.sopStep=1; if(c.sopStep>SOP.length) c.sopStep=SOP.length; });
  commit(); closeSheet();
  if(view!=="guide") go("guide"); else render();
  toast("SOP 流程已更新");
}
function wipeAll(){
  openSheet("清空所有資料", `<p style="font-size:14px">這會刪除全部 <b>${DB.clients.length}</b> 位客戶與所有紀錄，無法復原。</p>
    <p style="font-size:13px;color:var(--muted)">建議先匯出備份再清空。</p>
    <div class="btnrow"><button class="btn ghost" style="flex:1" onclick="exportData()">先匯出</button>
    <button class="btn red" style="flex:1" onclick="confirmWipe()">確認清空</button></div>`);
}
function confirmWipe(){ DB.clients=[]; commit(); closeSheet(); go("clients"); toast("已清空"); }

/* ============ detail ============ */
function openDetail(id){
  const c=DB.clients.find(x=>x.id===id); if(!c) return;
  const g=c.grade||""; const gc=g?("g-"+g):"g-none"; const meta=GRADES[g];
  const cur=curStep(c);
  const polN=(c.policies||[]).length;
  const openClaims=(c.claims||[]).filter(x=>x.status!=="已結案").length;
  const referred=DB.clients.filter(x=>x.referrerId===c.id);
  const upcoming=autoReminders(c).concat((c.reminders||[]).filter(r=>!r.done).map(r=>({date:r.date,title:r.title,type:"manual"}))).sort((a,b)=>a.date<b.date?-1:1)[0];

  const sopRows=SOP.map(s=>{
    const cls=s.n<c.sopStep?"done":s.n===c.sopStep?"cur":"";
    const st=(c.sopStatus&&c.sopStatus[s.n])||null;
    const sub = st&&st.note ? `<small>${esc(st.note)}${st.date?` ・ ${esc(fmtDate(st.date))}`:""}</small>`
              : s.n===c.sopStep ? `<small>目前所在階段</small>`
              : `<small style="color:var(--faint)">點此記錄這個階段</small>`;
    return `<div class="sopstep ${cls}" onclick="editSopStep('${c.id}',${s.n})">
      <div class="badge">${s.n}</div>
      <div class="t" style="flex:1">${esc(s.title)}${sub}</div>
      <svg class="sopedit" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>`;
  }).join("");

  const policies=(c.policies||[]).length? c.policies.map(p=>`
    <div class="kv"><span class="k">${esc(p.mainName||"保單")}${p.category?` ・${esc(p.category)}`:""}</span>
    <span class="v">${p.totalPremium?esc(p.totalPremium)+" 元":(p.premium?esc(p.premium)+" 元":"")}</span></div>
    ${p.insured?`<div style="font-size:12px;color:var(--amber);font-weight:700;padding:2px 0 4px">🧍 被保險人：${esc(p.insured)}${p.insuredRel?`（${esc(p.insuredRel)}）`:""}</div>`:""}
    <div style="font-size:12px;color:var(--muted);padding:0 0 ${(p.riders&&p.riders.length)?"6px":"8px"};${(p.riders&&p.riders.length)?"":"border-bottom:1px solid var(--line-2)"}">
      ${p.policyNo?"No. "+esc(p.policyNo)+"　":""}${p.company?esc(p.company)+" ・ ":""}${p.payFreq?esc(p.payFreq)+" ・ ":""}${p.coverage?"保額 "+esc(p.coverage)+" ・ ":""}${p.term?esc(p.term)+" ・ ":""}${p.startDate?"投保 "+fmtDate(p.startDate):""}${(p.paymentDate&&policyPaymentActive(p))?" ・ 繳費 "+fmtDate(p.paymentDate):""}${p.maturityDate?" ・ 主約繳費滿期 "+fmtDate(p.maturityDate):""}
    </div>
    ${(p.riders&&p.riders.length)?`<div class="riderlist">${p.riders.map(r=>`<div class="rideritem"><span>↳ ${esc(r.name||"附約")}</span><span class="rc">${[r.coverage?"保額 "+esc(r.coverage):"", r.premium?"保費 "+esc(r.premium):"", r.term?esc(r.term):""].filter(Boolean).join("　")}</span></div>`).join("")}</div>`:""}
    ${p.notes?`<div style="font-size:12px;color:var(--muted);padding:6px 0 8px;border-bottom:1px solid var(--line-2)">📝 ${esc(p.notes)}</div>`:""}`).join("") : `<div style="color:var(--faint);font-size:13px">尚無保單紀錄</div>`;

  const claims=(c.claims||[]).length? c.claims.map(cl=>`
    <div style="cursor:pointer" onclick="editClaim('${c.id}','${cl.id}')">
      <div class="kv"><span class="k">${esc(fmtDate(cl.date))} ${esc(cl.type||"")}</span>
      <span class="v" style="color:${cl.status==="已結案"?"var(--ok)":"var(--amber)"}">${esc(cl.status||"待處理")}</span></div>
      ${cl.note?`<div style="font-size:12px;color:var(--muted);padding:0 0 8px">${esc(cl.note)}</div>`:""}
    </div>`).join("") : `<div style="color:var(--faint);font-size:13px">尚無理賠紀錄</div>`;

  const care=(c.careLog||[]).length? c.careLog.slice().reverse().map(l=>`
    <div class="kv"><span class="k mono" style="flex:none">${esc(fmtDate(l.date))}</span><span class="v" style="font-weight:500;text-align:left">${esc(l.note)}</span></div>`).join("") : `<div style="color:var(--faint);font-size:13px">尚無聯繫紀錄</div>`;

  const html=`
    <div class="detail-hero">
      <div class="top">
        <div class="avatar" style="width:54px;height:54px;font-size:21px;background:var(--pine)">${esc(initial(c.name))}</div>
        <div style="flex:1;min-width:0">
          <h2>${esc(c.name||"未命名")} <span class="gradebadge ${gc}" style="vertical-align:middle">${g||"–"}</span></h2>
          <div style="font-size:12.5px;color:var(--muted);margin-top:2px">${esc(meta.note)} ・ SOP ${c.sopStep}. ${esc(cur.short)}</div>
        </div>
      </div>
      <div class="meta">
        ${c.phone?`<a href="tel:${esc(c.phone)}">📞 ${esc(c.phone)}</a>`:""}
        ${(c.tags||[]).map(t=>`<span class="regiontag">🏷️ ${esc(t)}</span>`).join("")}
        ${c.unit?`<span>🏢 ${esc(c.unit)}</span>`:""}
        ${c.birthday?`<span>🎂 ${esc(fmtDate(c.birthday))}</span>`:""}
        ${c.occupation?`<span>${esc(c.occupation)}</span>`:""}
        ${c.email?`<a href="mailto:${esc(c.email)}">✉️ ${esc(c.email)}</a>`:""}
        ${c.address?`<span>🏠 ${esc(c.address)}</span>`:""}
        ${referrerMetaHtml(c)}
      </div>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="v">${polN}</div><div class="l">保單</div></div>
      <div class="kpi"><div class="v">${openClaims}</div><div class="l">理賠處理中</div></div>
      <div class="kpi"><div class="v">${upcoming?fmtDate(upcoming.date).slice(5):"–"}</div><div class="l">下次提醒</div></div>
    </div>

    <div class="block"><h4>🧭 SOP 進度<span class="tag">點步驟記錄／設為目前</span></h4><div class="sopfull">${sopRows}</div></div>

    ${c.needs?`<div class="block"><h4>📝 需求重點</h4><div class="block-body" style="font-size:14px;line-height:1.6">${esc(c.needs)}</div></div>`:""}

    <div class="block"><h4>🛡️ 保單<span class="tag">${polN} 張</span></h4><div class="block-body">${policies}</div></div>

    ${referred.length?`<div class="block"><h4>🤝 由此人轉介的客戶<span class="tag">${referred.length} 位</span></h4><div class="block-body">
      ${referred.map(rc=>`<div class="kv" style="cursor:pointer" onclick="openDetail('${rc.id}')"><span class="k">${esc(rc.name)}</span><span class="v" style="color:var(--muted);font-weight:500">${rc.phone?esc(rc.phone):""}</span></div>`).join("")}
    </div></div>`:""}

    <div class="block"><h4>📞 定聯／關懷紀錄</h4><div class="block-body">${care}
      <button class="addrow" style="margin-top:10px" onclick="addCare('${c.id}')">＋ 記一筆聯繫</button></div></div>

let lc=null;  // line composer state
const AUTO_VARS=["姓名","顧問"];
const POLICY_VARS={"公司":"company","保費":"premium","保單":"mainName"};
function lineCompose(cid, tid){
  const c=DB.clients.find(x=>x.id===cid); if(!c) return;
  const tpl=LINE_TPL.find(t=>t.id===tid)||LINE_TPL[0]; if(!tpl) return;
  const tokens=[...new Set((tpl.body.match(/\{([^}]+)\}/g)||[]).map(s=>s.slice(1,-1)))];
  const fields=tokens.filter(t=>!AUTO_VARS.includes(t));
  lc={cid, tid:tpl.id, fields};
  const pol=(c.policies||[])[0]||{};
  const prefill=t=>{ const k=POLICY_VARS[t]; return k?(pol[k]||""):""; };
  const usesPolicy=fields.some(t=>POLICY_VARS[t]);
  const polPick = ((c.policies||[]).length && usesPolicy)
    ? `<div class="field"><label>從保單帶入（選填）</label>
        <select id="lfPick" onchange="lineFillPolicy()"><option value="">選擇保單自動填入…</option>
        ${c.policies.map((p,i)=>`<option value="${i}">${esc(p.mainName||("保單 "+(i+1)))}${p.company?" ・"+esc(p.company):""}</option>`).join("")}</select></div>` : "";
  const inputs = fields.map((t,i)=>`<div class="field"><label>${esc(t)}</label>
     <input id="lf${i}" value="${esc(prefill(t))}" oninput="lineRender()" placeholder="填入${esc(t)}"></div>`).join("");
  openSheet(esc(tpl.title), `
    ${polPick}${inputs}
    <div class="formsec">預覽</div>
    <div class="linepreview" id="linePreview"></div>
    <button class="linebtn" style="margin-top:14px;justify-content:center" onclick="copyLine()">
      <span class="ic">💬</span><span style="font-weight:700">複製訊息，貼到 LINE 傳送</span></button>
    <button class="btn ghost full" style="margin-top:10px" onclick="openLineTplEditor('${tpl.id}')">✏️ 編輯這則範本</button>`);
  lineRender();
}
function lineFillPolicy(){
  const c=DB.clients.find(x=>x.id===lc.cid); if(!c) return;
  const i=$("#lfPick").value; if(i==="") return;
  const p=(c.policies||[])[+i]||{};
  lc.fields.forEach((t,idx)=>{ const el=$("#lf"+idx); if(!el) return; const k=POLICY_VARS[t]; if(k&&p[k]) el.value=p[k]; });
  lineRender();
}
function buildLineMsg(){
  if(!lc) return "";
  const c=DB.clients.find(x=>x.id===lc.cid); const tpl=LINE_TPL.find(t=>t.id===lc.tid);
  if(!c||!tpl) return "";
  const agent=(DB.meta.agent||"").trim();
  let body=tpl.body.split("{姓名}").join(c.name||"").split("{顧問}").join(agent);
  lc.fields.forEach((t,i)=>{ const v=(($("#lf"+i)||{}).value||""); body=body.split("{"+t+"}").join(v); });
  if(!agent) body=body.replace(/\n*——\s*$/,"");
  return body.replace(/[ \t]+\n/g,"\n").trim();
}
function lineRender(){ const el=$("#linePreview"); if(el) el.textContent=buildLineMsg(); }
function copyLine(){
  const txt=buildLineMsg();
  try{ navigator.clipboard.writeText(txt); }
  catch(e){ const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove(); }
  toast("已複製，貼到 LINE 即可傳送");
}

/* ---- LINE template library editor ---- */
let _tplEdit=null;
function openLineTplEditor(focusId){
  _tplEdit=LINE_TPL.map(t=>({id:t.id,title:t.title,body:t.body}));
  renderLineTplEditor(focusId);
}
function renderLineTplEditor(focusId){
  const rows=_tplEdit.map((t,i)=>`
    <div class="subcard" ${t.id===focusId?'style="border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)"':''}>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px">
        <span style="font-size:11px;font-weight:800;color:var(--muted)">#${i+1}</span>
        <input value="${esc(t.title)}" oninput="tplSet(${i},'title',this.value)" placeholder="範本名稱（如：過年祝福）" style="flex:1;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px">
        <button class="sopmini" onclick="tplMove(${i},-1)" ${i===0?"disabled":""}>↑</button>
        <button class="sopmini" onclick="tplMove(${i},1)" ${i===_tplEdit.length-1?"disabled":""}>↓</button>
        <button class="sopmini del" onclick="tplDel(${i})">×</button>
      </div>
      <textarea oninput="tplSet(${i},'body',this.value)" placeholder="訊息內容…" style="min-height:88px;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6;font-family:var(--sans)">${esc(t.body)}</textarea>
    </div>`).join("");
  openSheet("LINE 訊息範本", `
    <div style="background:var(--teal-soft);border-radius:11px;padding:11px 13px;margin-bottom:14px;font-size:12.5px;color:#1f5249;line-height:1.7">
      用<b>大括號</b>插入自動帶入的變數：<br>
      <b>{姓名}</b> 客戶姓名　<b>{顧問}</b> 你的署名（設定裡填）<br>
      <b>{公司}</b> <b>{保費}</b> <b>{保單}</b> <b>{金額}</b> 傳送時填入（保單相關會自動帶）<br>
      也可自訂任意變數，例如 <b>{活動}</b>，傳送時會出現填寫欄。
    </div>
    ${rows}
    ${_tplEdit.length<20?`<button class="addrow" onclick="tplAdd()">＋ 新增範本</button>`:""}
    <div class="btnrow" style="margin-top:16px">
      <button class="btn ghost" style="flex:1" onclick="tplResetDefault()">還原預設</button>
      <button class="btn green" style="flex:2" onclick="tplSave()">儲存範本</button>
    </div>`);
}
function tplSet(i,k,v){ if(_tplEdit[i]) _tplEdit[i][k]=v; }
function tplMove(i,d){ const j=i+d; if(j<0||j>=_tplEdit.length) return; const t=_tplEdit[i]; _tplEdit[i]=_tplEdit[j]; _tplEdit[j]=t; renderLineTplEditor(); }
function tplDel(i){ if(_tplEdit.length<=1){ toast("至少保留 1 則範本","warn"); return; } _tplEdit.splice(i,1); renderLineTplEditor(); }
function tplAdd(){ _tplEdit.push({id:uid(), title:"新範本", body:"{姓名} 您好 😊\n\n—— {顧問}"}); renderLineTplEditor(); }
function tplResetDefault(){ _tplEdit=DEFAULT_LINE_TPL.map(t=>({id:t.id,title:t.title,body:t.body})); renderLineTplEditor(); toast("已載入預設範本（尚未儲存）"); }
function tplSave(){
  for(const t of _tplEdit){ if(!(t.title||"").trim()){ toast("每則範本都要有名稱","warn"); return; } if(!(t.body||"").trim()){ toast("範本內容不可空白","warn"); return; } }
  DB.meta.lineTemplates=_tplEdit.map(t=>({id:t.id||uid(), title:t.title.trim(), body:t.body}));
  loadLineTemplates(); commit(); closeSheet(); toast("LINE 範本已儲存");
}

/* ---- SOP step editor ---- */
function editSopStep(cid, n){
  const c=DB.clients.find(x=>x.id===cid); if(!c) return;
  const s=SOP[n-1];
  const st=(c.sopStatus&&c.sopStatus[n])||{};
  const isCur=c.sopStep===n;
  const done=n<c.sopStep;
  const state = isCur?`<span style="color:var(--amber);font-weight:700">● 目前進度</span>` : done?`<span style="color:var(--teal);font-weight:700">✓ 已通過</span>` : `<span style="color:var(--faint)">尚未進行</span>`;
  openSheet(`${n}. ${esc(s.short)}`, `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <div class="badge" style="width:36px;height:36px;border-radius:10px;background:${isCur?'var(--amber)':done?'var(--teal)':'var(--line)'};color:${isCur||done?'#fff':'var(--muted)'};display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:16px">${n}</div>
      <div><div style="font-weight:700;font-size:15px">${esc(s.title)}</div><div style="font-size:12px;margin-top:2px">${state}</div></div>
    </div>
    <p style="font-size:12.5px;color:var(--muted);margin:0 0 16px">${esc(s.desc)}</p>

    <div class="field"><label>這個階段的紀錄</label>
      <textarea id="sopNote" placeholder="記下這一步做了什麼、客戶反應、下一步打算…">${esc(st.note||"")}</textarea></div>
    ${dateFieldHtml("sopDate", st.date||"", "日期")}
    ${tempPickerHtml("sopTemp", st.temp||"")}

    ${isCur
      ? `<div style="background:var(--amber-soft);color:#7a5410;font-size:13px;font-weight:600;padding:11px 13px;border-radius:11px;text-align:center">這位客戶目前就在第 ${n} 步</div>`
      : `<button class="btn amber full" onclick="setSopCurrent('${cid}',${n})">設為目前進度（移到第 ${n} 步）</button>`}
    <button class="btn green full" style="margin-top:10px" onclick="saveSopStep('${cid}',${n})">儲存紀錄</button>
    ${(st.note||st.date)?`<button class="btn ghost full" style="margin-top:8px;color:var(--danger)" onclick="clearSopStep('${cid}',${n})">清除此階段紀錄</button>`:""}
  `);
}
function setSopCurrent(cid,n){
  const c=DB.clients.find(x=>x.id===cid); if(!c) return;
  // keep whatever note is being typed
  const note=($("#sopNote")||{}).value, date=($("#sopDate")||{}).value, temp=($("#sopTemp_val")||{}).value;
  if(note!=null && (note.trim()||date||temp)){ c.sopStatus=c.sopStatus||{}; c.sopStatus[n]={note:note.trim(),date:date||"",temp:temp||""}; }
  c.sopStep=n; commit(); editSopStep(cid,n); toast("已設為第 "+n+" 步："+SOP[n-1].short);
}
function saveSopStep(cid,n){
  const c=DB.clients.find(x=>x.id===cid); if(!c) return;
  c.sopStatus=c.sopStatus||{};
  const note=$("#sopNote").value.trim(), date=$("#sopDate").value, temp=($("#sopTemp_val")||{}).value||"";
  if(note||date||temp) c.sopStatus[n]={note,date,temp}; else delete c.sopStatus[n];
  commit(); openDetail(cid); toast("已儲存階段紀錄");
}
function clearSopStep(cid,n){
  const c=DB.clients.find(x=>x.id===cid); if(!c) return;
  if(c.sopStatus) delete c.sopStatus[n];
  commit(); openDetail(cid); toast("已清除");
}

let _tessLoading=null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(_tessLoading) return _tessLoading;
  _tessLoading=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload=()=>res(); s.onerror=()=>{ _tessLoading=null; rej(new Error("load fail")); };
    document.head.appendChild(s);
  });
  return _tessLoading;
}
function ocrStatusZh(s){
  return ({"loading tesseract core":"載入辨識引擎…","initializing tesseract":"初始化…","loading language traineddata":"下載中文辨識模組…","initializing api":"準備中…","recognizing text":"辨識中…"})[s]||"處理中…";
}
async function ocrImage(input){
  const f=input.files&&input.files[0]; if(!f){ return; }
  input.value="";
  openSheet("辨識截圖", `<div style="text-align:center;padding:26px 10px">
    <div style="font-size:15px;font-weight:700;margin-bottom:12px">正在辨識截圖文字…</div>
    <div style="font-size:14px;color:var(--pine);font-weight:700" id="ocrPct">載入辨識引擎…</div>
    <div style="height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 20px 0">
      <div id="ocrBar" style="height:100%;width:5%;background:var(--amber);transition:width .3s"></div></div>
    <p style="font-size:12px;color:var(--muted);margin-top:18px">第一次使用需連網下載辨識模組（約數 MB），請稍候；之後會快很多。</p>
  </div>`);
  try{
    await loadTesseract();
    const worker = await Tesseract.createWorker(["chi_tra","eng"], 1, {
      logger:m=>{
        const pct=$("#ocrPct"), bar=$("#ocrBar");
        if(m.status==="recognizing text"){ const p=Math.round((m.progress||0)*100); if(pct) pct.textContent="辨識中 "+p+"%"; if(bar) bar.style.width=Math.max(8,p)+"%"; }
        else { if(pct) pct.textContent=ocrStatusZh(m.status); if(bar) bar.style.width=(m.status==="loading language traineddata"?"45":"25")+"%"; }
      }
    });
    const { data } = await worker.recognize(f);
    await worker.terminate();
    const text=((data&&data.text)||"").replace(/\n{3,}/g,"\n\n").trim();
    if(!text){ toast("沒辨識到文字，請換清楚一點的截圖，或改用貼上","warn"); openSmartImport(); return; }
    openSmartImport(text);
    toast("已辨識，請確認文字後按「辨識欄位並預覽」");
  }catch(e){
    openSmartImport();
    toast("辨識失敗（可能沒網路）。可改用 iPad 長按截圖文字→拷貝→貼上","err");
  }
}
function smartFile(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const text=String(r.result||"");
    if(/BEGIN:VCARD/i.test(text)){
      const list=parseVCards(text);
      if(list.length===0){ toast("檔案沒有可用的聯絡人","warn"); return; }
      showSmartPreview(list);
    } else {
      showSmartPreview([extractFields(text)]);
    }
  };

  r.readAsText(f);

function parseSmart(){

function extractFields(text){
  const f={};
  const em=text.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/); if(em) f.email=em[0];
  let ph=text.match(/09\d{2}[\s\-.]?\d{3}[\s\-.]?\d{3}/);
  if(!ph) ph=text.match(/0\d{1,2}[\s\-.]?\d{3,4}[\s\-.]?\d{4}/);
  if(ph){ let dg=ph[0].replace(/\D/g,""); if(/^09\d{8}$/.test(dg)) dg=dg.replace(/(\d{4})(\d{3})(\d{3})/,"$1-$2-$3"); f.phone=dg; }
  let un=text.match(/(?:單位|服務單位|公司|任職於|服務於|任職公司|工作單位)\s*[：:]\s*([^\n\r，,]{2,20})/);
  if(un) f.unit=un[1].trim();
  f.birthday=extractBirthday(text);
  let nm=text.match(/(?:姓名|名字|客戶|稱呼|名稱|聯絡人|Name)\s*[：:]\s*([\u4e00-\u9fa5]{2,5}|[A-Za-z][A-Za-z .]{1,20}[A-Za-z])/);
  if(nm){ f.name=nm[1].trim(); }
  else {
    const lines=text.split(/[\s\n\r、，,]+/).map(s=>s.trim()).filter(Boolean);
    for(const L of lines){
      if(/^[\u4e00-\u9fa5]{2,4}$/.test(L) && !/保險|公司|地址|電話|手機|行動|生日|出生|職業|先生|小姐|女士|備註|聯絡|資料/.test(L)){ f.name=L; break; }
    }
  }
  let oc=text.match(/(?:職業|工作|任職|職稱)\s*[：:]\s*([^\n\r，,]{1,16})/); if(oc) f.occupation=oc[1].trim();
  let ad=text.match(/(?:地址|住址|戶籍|通訊地址)\s*[：:]\s*([^\n\r]{4,40})/); if(ad) f.address=ad[1].trim();
  const region=detectRegion(f.address||text); if(region) f.tags=[region];
  return f;
}
const TW_REGIONS=["台北市","臺北市","新北市","桃園市","台中市","臺中市","台南市","臺南市","高雄市","基隆市","新竹市","新竹縣","苗栗縣","彰化縣","南投縣","雲林縣","嘉義市","嘉義縣","屏東縣","宜蘭縣","花蓮縣","台東縣","臺東縣","澎湖縣","金門縣","連江縣"];
function detectRegion(text){
  if(!text) return "";
  for(const r of TW_REGIONS){ if(text.includes(r)) return r.replace("臺","台"); }
  return "";
}
function extractBirthday(text){
  let m=text.match(/((?:19|20)\d{2})\s*[\/\-.年]\s*(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})/);
  if(m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m=text.match(/民國\s*(\d{2,3})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})/);
  if(m) return `${1911+ +m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m=text.match(/(?:生日|出生)[^0-9]{0,6}(\d{2,3})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{1,2})/);
  if(m){ let y=+m[1]; if(y<200) y=1911+y; if(y>1900&&y<2100) return `${y}-${pad(+m[2])}-${pad(+m[3])}`; }
  return "";
}
function parseVCards(text){
  const blocks=text.split(/BEGIN:VCARD/i).slice(1);
  return blocks.map(raw=>{
    const b="\n"+raw.replace(/\r/g,"");
    const get=re=>{ const m=b.match(re); return m?m[1].trim():""; };
    let name=get(/\nFN[^:\n]*:(.+)/i);
    if(!name){ const n=get(/\nN[^:\n]*:(.+)/i); if(n){ const p=n.split(";"); name=((p[1]||"")+(p[0]||"")).trim()||p.join("").trim(); } }
    let tel=get(/\nTEL[^:\n]*:(.+)/i); if(tel){ let dg=tel.replace(/[^\d+]/g,""); const mob=dg.replace(/^\+886/,"0"); if(/^09\d{8}$/.test(mob)) dg=mob.replace(/(\d{4})(\d{3})(\d{3})/,"$1-$2-$3"); tel=dg; }
    let bday=get(/\nBDAY[^:\n]*:(.+)/i); if(bday){ const m=bday.match(/(\d{4})-?(\d{2})-?(\d{2})/); bday=m?`${m[1]}-${m[2]}-${m[3]}`:""; }
    const email=get(/\nEMAIL[^:\n]*:(.+)/i);
    const org=get(/\nORG[^:\n]*:(.+)/i).replace(/;+/g," ").trim();
    const title=get(/\nTITLE[^:\n]*:(.+)/i);
    const adr=get(/\nADR[^:\n]*:(.+)/i).replace(/;+/g," ").trim();
    const region=detectRegion(adr);
    return {name, phone:tel, birthday:bday, email, occupation:title, unit:org, address:adr, tags: region?[region]:[]};
  }).filter(c=>c.name||c.phone);
}

function referrerMetaHtml(c){
  if(c.referrerId){
    const rc=DB.clients.find(x=>x.id===c.referrerId);
    if(rc) return `<span class="reflink" onclick="event.stopPropagation();openDetail('${rc.id}')">👤 轉介來源：${esc(rc.name)}</span>`;
    return `<span>👤 轉介來源：(客戶已刪除)</span>`;
  }
  if(c.referrerName) return `<span>👤 轉介來源：${esc(c.referrerName)}</span>`;
  return "";
}
function checkReferrerMatches(newClientId){
  const nc=DB.clients.find(x=>x.id===newClientId); if(!nc) return;
  const nm=(nc.name||"").trim().toLowerCase(); if(!nm) return;
  const matches=DB.clients.filter(c=>c.id!==newClientId && !c.referrerId && (c.referrerName||"").trim().toLowerCase()===nm);
  if(!matches.length) return;
  openSheet("發現可能相符的轉介來源", `
    <p style="font-size:14px;line-height:1.7">系統發現以下 <b>${matches.length}</b> 位客戶的轉介來源欄位寫的是「<b>${esc(nc.name)}</b>」，跟你剛新增的這位客戶同名。要把他們的轉介來源改成連結到這位新客戶嗎？</p>
    <div class="tagmanage" style="margin:12px 0">
      ${matches.map(c=>`<div class="tmrow"><span class="tmname">${esc(c.name)}</span></div>`).join("")}
    </div>
    <div class="btnrow">
      <button class="btn ghost" onclick="closeSheet()">先不用</button>
      <button class="btn green" onclick="applyReferrerMatches('${newClientId}')">全部連結</button>
    </div>
  `);
}
function applyReferrerMatches(newClientId){
  const nc=DB.clients.find(x=>x.id===newClientId); if(!nc) return;
  const nm=(nc.name||"").trim().toLowerCase();
  let n=0;
  DB.clients.forEach(c=>{
    if(c.id!==newClientId && !c.referrerId && (c.referrerName||"").trim().toLowerCase()===nm){
      c.referrerId=newClientId; c.referrerName=""; n++;
    }
  });
  commit(); closeSheet();
  toast(`已連結 ${n} 筆客戶的轉介來源`);
  render();
}
let scanReferrerResults=[];
function scanReferrerMatches(){
  const results=[];
  DB.clients.forEach(c=>{
    if(c.referrerId || !(c.referrerName||"").trim()) return;
    const nm=c.referrerName.trim().toLowerCase();
    const rc=DB.clients.find(x=>x.id!==c.id && (x.name||"").trim().toLowerCase()===nm);
    if(rc) results.push({cid:c.id, cname:c.name, rid:rc.id, rname:rc.name});
  });
  scanReferrerResults=results;
  if(!results.length){ toast("目前沒有找到可以自動連結的轉介來源"); return; }
  openSheet("掃描結果：可自動連結的轉介來源", `
    <p style="font-size:13.5px;color:var(--muted);margin-bottom:10px">找到 ${results.length} 筆，轉介來源欄位的文字跟某位既有客戶同名：</p>
    <div class="tagmanage" style="margin-bottom:14px">
      ${results.map(r=>`<div class="tmrow"><span class="tmname">${esc(r.cname)}</span><span class="tmcount">→ ${esc(r.rname)}</span></div>`).join("")}
    </div>
    <div class="btnrow">
      <button class="btn ghost" onclick="closeSheet()">先不用</button>
      <button class="btn green" onclick="applyScanReferrerMatches()">全部連結</button>
    </div>
  `);
}
function applyScanReferrerMatches(){
  const results=scanReferrerResults||[];
  results.forEach(r=>{ const c=DB.clients.find(x=>x.id===r.cid); if(c){ c.referrerId=r.rid; c.referrerName=""; } });
  scanReferrerResults=[];
  commit(); closeSheet();
  toast(`已連結 ${results.length} 筆`);
  render();
}

function gpToggle(el){
  const cid=el.dataset.cid, pid=el.dataset.pid;

  const box=$("#gpApplyArea"); if(!box) return;

function polRecalcTotal(i){
  const p=editingPolicies[i]; if(!p) return;
  const total=numVal(p.premium)+(p.riders||[]).reduce((s,r)=>s+numVal(r.premium),0);
  p.totalPremium = total? String(total) : "";
  const el=$(`#pol_${i}_total`);
  if(el) el.value = total? total.toLocaleString("en-US") : "";
}
function addRider(i){ if(!editingPolicies[i]) return; if(!editingPolicies[i].riders) editingPolicies[i].riders=[]; editingPolicies[i].riders.push({name:"",coverage:"",premium:"",term:""}); renderPolicyRows(); }
function rmRider(i,ri){ if(editingPolicies[i]&&editingPolicies[i].riders){ editingPolicies[i].riders.splice(ri,1); renderPolicyRows(); polRecalcTotal(i); } }
function riderSet(i,ri,k,v){ const p=editingPolicies[i]; if(p&&p.riders&&p.riders[ri]){ p.riders[ri][k]=v; if(k==="premium") polRecalcTotal(i); } }
function addPolicyRow(){ editingPolicies.push({id:uid(),mainName:"",policyNo:"",category:"",company:"",groupProject:"",premium:"",totalPremium:"",payFreq:"",insured:"",insuredRel:"",coverage:"",term:"",startDate:"",paymentDate:"",maturityDate:"",notes:"",riders:[]}); renderPolicyRows(); }
function rmPolicy(i){ editingPolicies.splice(i,1); renderPolicyRows(); }
function polRecalcMaturity(i){
  const p=editingPolicies[i]; if(!p) return;
  const years=parseYearsNum(p.term);
  if(p.startDate && years!=null){
    p.maturityDate=addYearsISO(p.startDate, years);
    const hidden=$(`#pol_${i}_maturityDate`), disp=$(`#pol_${i}_maturityDate_disp`);
    if(hidden) hidden.value=p.maturityDate;
    if(disp) disp.value=isoToDisp(p.maturityDate);
  }
}
function polSet(i,k,v){
  const p=editingPolicies[i]; if(!p) return;
  p[k]=v;
  if(k==="startDate"||k==="term"){ polRecalcMaturity(i); }
  if(k==="startDate"||k==="payFreq"){
    p.paymentDate = nextPaymentDate(p.startDate, p.payFreq);
    const hidden=$(`#pol_${i}_paymentDate`), disp=$(`#pol_${i}_paymentDate_disp`);
    if(hidden) hidden.value=p.paymentDate;
    if(disp) disp.value=isoToDisp(p.paymentDate);
  }
  if(k==="premium") polRecalcTotal(i);
}
function polCompanySel(i,v){
  if(!editingPolicies[i]) return;
  if(v==="__other__"){ editingPolicies[i].companyOther=true; editingPolicies[i].company=""; renderPolicyRows(); return; }
  editingPolicies[i].companyOther=false;
  polSet(i,"company",v);
}

function saveClient(auto){
  const nameEl=$("#edName"); if(!nameEl) return;
  const name=nameEl.value.trim();
  if(!name){ if(!auto){ toast("請填寫姓名","warn"); nameEl.focus(); } return; }
  const pendingTag=($("#edTagInput")||{}).value?.trim();
  if(pendingTag && !editingTags.includes(pendingTag)) editingTags.push(pendingTag);
  const pendingRef=($("#refFreeText")||{}).value?.trim();
  if(pendingRef && !editingReferrerId && !editingReferrerName) editingReferrerName=pendingRef;
  const idEl=$("#edId"); const id=idEl.value;
  const wasNew=!id;
  const data={
    name, phone:$("#edPhone").value.trim(), unit:$("#edUnit").value.trim(),
    birthday:$("#edBday").value, occupation:$("#edJob").value.trim(),
    email:($("#edEmail")||{}).value?.trim()||"", address:($("#edAddr")||{}).value?.trim()||"",
    tags: editingTags.slice(),
    referrerId: editingReferrerId||"", referrerName: editingReferrerId?"":(editingReferrerName||""),
    grade:$("#edGrade").value, gradeAuto:editingGradeAuto, sopStep:+$("#edStep").value||1,
    needs:$("#edNeeds").value.trim(), notes:$("#edNotes").value.trim(),
    giftDesk:!!($("#edGiftDesk")||{}).checked, giftWall:!!($("#edGiftWall")||{}).checked,
    giftOther:!!($("#edGiftOther")||{}).checked,
    giftOtherText:($("#edGiftOther")||{}).checked?(($("#edGiftOtherText")||{}).value||"").trim():"",
    policies:editingPolicies
      .map(p=>{
        const riders=(p.riders||[]).filter(r=>(r.name||"").trim()||(r.coverage||"").trim()||(r.premium||"").trim()||(r.term||"").trim());
        const total=numVal(p.premium)+riders.reduce((s,r)=>s+numVal(r.premium),0);
        return {...p, riders, totalPremium: total? String(total) : ""};
      })
      .filter(p=>p.mainName||p.category||p.company||p.premium||p.policyNo||(p.riders&&p.riders.length)),
  };
  DB.tagCatalog = DB.tagCatalog||[];
  data.tags.forEach(t=>{ if(t && !DB.tagCatalog.includes(t)) DB.tagCatalog.push(t); });
  DB.groupProjectCatalog = DB.groupProjectCatalog||[];
  data.policies.forEach(p=>{ if(p.groupProject && !DB.groupProjectCatalog.includes(p.groupProject)) DB.groupProjectCatalog.push(p.groupProject); });
  if(id){
    const c=DB.clients.find(x=>x.id===id);
    Object.assign(c,data);
  }else{
    const newId=uid();
    DB.clients.push(Object.assign({id:newId,reminders:[],claims:[],careLog:[],sopStatus:{},createdAt:new Date().toISOString()},data));
    idEl.value=newId;
  }
  commit();
  if(auto){ toast("已自動存檔"); return; }
  closeSheet();
  if(id){ openDetail(id); } else { go("clients"); }
  toast(id?"已儲存變更":"已新增客戶");
  if(wasNew) checkReferrerMatches(idEl.value);
}

/* ============ sheet / toast ============ */
function openSheet(title, body){
  const s=$("#scrim");
  s.innerHTML=`<div class="sheet"><div class="sheet-head"><h2>${title}</h2><button class="x" onclick="closeSheet()">×</button></div><div class="sheet-body">${body}</div></div>`;
  s.classList.add("show");
  s.onclick=(e)=>{ if(e.target===s) closeSheet(); };
  document.body.style.overflow="hidden";
}
function closeSheet(){ editFormOpen=false; const s=$("#scrim"); s.classList.remove("show"); s.innerHTML=""; document.body.style.overflow=""; }
let toastT;
function toast(msg,kind=""){
  const t=$("#toast"); t.textContent=msg; t.className="toast show "+kind;
  clearTimeout(toastT); toastT=setTimeout(()=>t.className="toast "+kind,2600);
}

  }
  try{
    if(localStorage.getItem(GCAL_CONNECTED_KEY)==="1" && gcalClientId()){
      let tries=0;
      const tryConn=()=>{ tries++; if(gcalReady()){ gcalConnect(true); } else if(tries<20){ setTimeout(tryConn,250); } };
      setTimeout(tryConn,300);
    }
  }catch(e){}
  setInterval(()=>{ if(editFormOpen) saveClient(true); }, 5*60*1000);
})();
</script>
</body>
