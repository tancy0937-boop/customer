<title>保險客戶資料庫</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --pine:#173F39; --pine-2:#1F5249; --teal:#3C8C7C; --teal-soft:#E3F0EC;
  --amber:#B97E27; --amber-soft:#F2E2BE;
  --paper:#F4F2EA; --surface:#FFFFFF; --surface-2:#FBFAF5;
  --ink:#17231E; --muted:#6C7A74; --faint:#94A09A;
  --line:#E4E0D5; --line-2:#EEEBE2;
  --slate:#647570; --clay:#A2855F;
  --danger:#B23B3B; --danger-soft:#F3DCDC;
  --ok:#3C8C7C;
  --shadow:0 1px 2px rgba(23,35,30,.05), 0 10px 26px rgba(23,35,30,.07);
  --shadow-lg:0 8px 40px rgba(23,35,30,.18);
  --r:14px; --r-sm:10px; --r-lg:20px;
  --mono:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--paper);
  -webkit-text-size-adjust:100%; line-height:1.5;
  padding-bottom:calc(64px + var(--safe-bottom));
  overscroll-behavior-y:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
::placeholder{color:var(--faint)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--pine);color:#F4F2EA;
  padding:calc(var(--safe-top) + 10px) 16px 10px;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 1px 0 rgba(0,0,0,.12);
}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto;min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:11px;color:#A9C2BA;letter-spacing:1.5px;text-transform:uppercase}
.topact{display:flex;align-items:center;gap:8px}
.tb-btn{
  height:38px;padding:0 13px;border-radius:999px;font-size:13.5px;font-weight:600;
  background:rgba(255,255,255,.12);color:#F4F2EA;display:inline-flex;align-items:center;gap:6px;
  transition:background .15s,transform .1s;
}
.tb-btn:active{transform:scale(.95)}
.tb-btn.primary{background:var(--amber);color:#241A06}
.tb-btn.icon{width:38px;padding:0;justify-content:center;font-size:20px}

/* backup status pill */
.backup{
  display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;
  font-size:12.5px;font-weight:600;background:rgba(255,255,255,.1);
}
.backup .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px rgba(60,140,124,.25)}
.backup.dirty{background:rgba(185,126,39,.22);color:#F2E2BE}
.backup.dirty .dot{background:var(--amber);box-shadow:0 0 0 3px rgba(185,126,39,.3);animation:pulse 1.6s infinite}
.backup.fail{background:rgba(178,59,59,.25);color:#F3DCDC}
.backup.fail .dot{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ---------- layout ---------- */
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.viewhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 14px}
.viewhead h2{font-size:21px;margin:0;font-weight:700;letter-spacing:.3px}
.viewhead .count{font-family:var(--mono);font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:2px 9px;border-radius:999px}
.spacer{margin-left:auto}

.search{
  flex:1;min-width:200px;height:42px;border:1px solid var(--line);background:var(--surface);
  border-radius:12px;padding:0 14px;display:flex;align-items:center;gap:9px;
}
.search input{border:none;background:none;outline:none;width:100%;height:100%}
.search svg{flex:none;color:var(--faint)}

.filters{display:flex;gap:7px;flex-wrap:wrap}
.regiontag{background:var(--teal-soft);color:#1f5249;font-weight:600;padding:1px 8px;border-radius:999px;font-size:11.5px;display:inline-flex;align-items:center;gap:2px}
.tagfilters{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.tagfilters::-webkit-scrollbar{height:7px}
.tagfilters::-webkit-scrollbar-track{background:transparent}
.tagfilters::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}
.tagfilters::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.tagfilters .chip{height:auto;padding:10px 18px;font-size:14px;flex:none}
.tagpicker{display:flex;flex-wrap:wrap;gap:7px;min-height:22px;padding:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px}
.tagpicker .empty-hint{color:var(--faint);font-size:12.5px}
.tagpill{display:inline-flex;align-items:center;gap:3px;background:var(--teal-soft);color:#1f5249;font-weight:600;padding:4px 4px 4px 11px;border-radius:999px;font-size:12.5px}
.tagpill button{border:none;background:none;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:2px 5px;opacity:.65}
.tagpill button:hover{opacity:1}
.tagaddrow{display:flex;gap:8px;margin-top:9px}
.tagdrop{margin-top:9px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.tagdrop summary{list-style:none;cursor:pointer;padding:10px 12px;font-size:13px;font-weight:700;color:var(--teal);display:flex;align-items:center;gap:6px}
.tagdrop summary::-webkit-details-marker{display:none}
.tagdrop summary::before{content:"▸";font-size:11px;transition:transform .15s}
.tagdrop[open] summary::before{transform:rotate(90deg)}
.tagoptions{display:flex;flex-wrap:nowrap;gap:9px;padding:4px 12px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.tagoptions::-webkit-scrollbar{height:7px}
.tagoptions::-webkit-scrollbar-track{background:transparent}
.tagoptions::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}
.tagoptions::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.tagopt{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-size:13.5px;font-weight:600;padding:9px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;flex:none}
.scrollhint{text-align:center;font-size:11px;color:var(--faint);padding:0 12px 10px}
.tagopt.on{background:var(--teal-soft);color:#1f5249;border-color:transparent;font-weight:700}
.tagmanage{display:flex;flex-direction:column;gap:8px}
.tmrow{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:var(--surface);position:relative}
.tmhandle{cursor:grab;touch-action:none;color:var(--faint);font-size:17px;padding:0 2px;flex:none;user-select:none;line-height:1}
.tmrow.dragging{box-shadow:0 8px 18px rgba(0,0,0,.14);background:var(--surface-2);z-index:5}
.tmname{font-weight:700;font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmcount{font-size:11.5px;color:var(--muted);background:var(--surface-2);padding:2px 9px;border-radius:999px;flex:none;font-weight:700}
.tmcount.zero{color:var(--danger);background:var(--danger-soft)}
.tmbtn{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--teal);font-size:12px;font-weight:700;padding:6px 10px;border-radius:9px;cursor:pointer}
.tmbtn.danger{color:var(--danger);border-color:var(--danger-soft)}
.giftrow{display:flex;gap:16px;flex-wrap:wrap}
.giftchk{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.giftsummary-row{display:flex;gap:22px;flex-wrap:wrap}
.giftitem{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted);font-weight:600}
.giftitem b{font-family:var(--mono);font-size:16px;color:var(--pine)}
.giftsubtotal{padding:8px 16px;font-size:12px;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line-2);font-weight:600}
.quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.qstep{background:var(--surface-2);border-radius:11px;padding:11px 12px;font-size:13.5px;font-weight:600;color:var(--ink)}
.qstep .qn{display:block;font-size:11px;font-weight:700;color:var(--teal);margin-bottom:4px}
.reflinked{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);font-size:13.5px;font-weight:600;flex-wrap:wrap}
.reflinked .sp{flex:1}
.reflink{cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.tagaddrow input{flex:1}
.tagaddrow .btn{white-space:nowrap;padding:0 16px;height:42px}
.chip{
  height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;transition:.12s;
}
.chip.on{background:var(--pine);color:#fff;border-color:var(--pine)}
.chip:active{transform:scale(.96)}
.chip .n{font-family:var(--mono);font-size:11px;opacity:.85}

/* ---------- client cards ---------- */
.clientgrid{display:grid;grid-template-columns:1fr;gap:11px}
@media(min-width:720px){.clientgrid{grid-template-columns:1fr 1fr}}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:15px 16px;transition:transform .1s,box-shadow .15s;position:relative;overflow:hidden;
}
.card:active{transform:scale(.992)}
.card .grade-edge{position:absolute;left:0;top:0;bottom:0;width:5px}
.card-top{display:flex;align-items:flex-start;gap:11px;margin-bottom:11px}
.avatar{
  width:44px;height:44px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:#fff;background:var(--pine-2);letter-spacing:1px;
}
.card h3{margin:0;font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .sub{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.card .sub .mono{font-size:12px}
.gradebadge{
  font-size:11px;font-weight:800;width:22px;height:22px;border-radius:7px;display:inline-flex;
  align-items:center;justify-content:center;color:#fff;flex:none;
}
.g-A{background:var(--amber)} .g-B{background:var(--teal)} .g-C{background:var(--slate)} .g-D{background:var(--clay)}
.g-none{background:#C9D0CC;color:#5d6b66}

/* sop spine */
.spine{display:flex;align-items:center;gap:0;margin-top:4px}
.spine .seg{flex:1;height:5px;border-radius:3px;background:var(--line);position:relative}
.spine .seg.done{background:var(--teal)}
.spine .seg.cur{background:var(--amber)}
.spine-mini{display:flex;gap:4px;align-items:center}
.spine-mini i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.spine-mini i.done{background:var(--teal)} .spine-mini i.cur{background:var(--amber);transform:scale(1.35)}
.steplabel{font-size:11.5px;color:var(--muted);margin-top:7px;display:flex;justify-content:space-between}
.steplabel b{color:var(--pine);font-weight:700}

/* ---------- empty / generic ---------- */
.empty{
  text-align:center;padding:54px 24px;color:var(--muted);
  background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);
}
.empty .big{font-size:34px;margin-bottom:10px}
.empty h3{margin:0 0 6px;color:var(--ink);font-size:17px}
.empty p{margin:0 0 16px;font-size:14px}

/* ---------- bottom nav ---------- */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:rgba(251,250,245,.92);backdrop-filter:saturate(1.5) blur(14px);
  -webkit-backdrop-filter:saturate(1.5) blur(14px);
  border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(6px + var(--safe-bottom));
}
.navbtn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;
  color:var(--muted);font-size:10.5px;font-weight:600;transition:.12s;
}
.navbtn svg{width:23px;height:23px}
.navbtn.on{color:var(--pine)}
.navbtn.on .ic{background:var(--teal-soft)}
.navbtn .ic{width:46px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:.12s}
.navbtn .badge{position:absolute;transform:translate(13px,-8px);background:var(--danger);color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:var(--mono)}

/* ---------- modal ---------- */
.scrim{
  position:fixed;inset:0;z-index:60;background:rgba(23,35,30,.42);
  display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(2px);
}
.scrim.show{display:flex}
.sheet{
  background:var(--paper);width:100%;max-width:680px;max-height:94vh;border-radius:22px 22px 0 0;
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;
  animation:up .25s cubic-bezier(.2,.7,.2,1);
}
@media(min-width:680px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:90vh}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet-head{
  display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);
  background:var(--surface);flex:none;
}
.sheet-head h2{margin:0;font-size:18px;font-weight:700;margin-right:auto}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px;flex:1}
.x{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted);border:1px solid var(--line)}
.x:active{transform:scale(.92)}

/* ---------- form ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.3px}
.field input,.field select,.field textarea{
  width:100%;height:46px;border:1px solid var(--line);border-radius:11px;background:var(--surface);
  padding:0 13px;outline:none;transition:border .15s,box-shadow .15s;
}
.field textarea{height:auto;min-height:74px;padding:11px 13px;line-height:1.55;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.field.datefield label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.dtoggle{border:1px solid var(--line);background:var(--surface);color:var(--teal);font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;cursor:pointer;letter-spacing:0}
.dtoggle:active{transform:scale(.95)}
.dtrow{display:flex;gap:8px}
.dtinput{flex:1;font-variant-numeric:tabular-nums}
.dtpick{flex:none;width:46px;height:46px;border:1px solid var(--line);border-radius:11px;background:var(--surface);font-size:18px;line-height:1;cursor:pointer}
.dtpick:active{transform:scale(.95)}
.dterr{color:var(--danger);font-size:12px;margin-top:6px;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:520px){.row3{grid-template-columns:1fr 1fr}}
.formsec{margin:22px 0 8px;font-size:13px;font-weight:800;color:var(--pine);letter-spacing:1px;display:flex;align-items:center;gap:9px}
.formsec::after{content:"";flex:1;height:1px;background:var(--line)}

/* grade picker */
.gradepick{display:flex;gap:8px}
.gradepick button{
  flex:1;height:48px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);
  font-weight:800;font-size:15px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
.gradepick button small{font-size:9.5px;font-weight:600;letter-spacing:.3px}
.gradepick button.sel.s-A{background:var(--amber);color:#fff;border-color:var(--amber)}
.gradepick button.sel.s-B{background:var(--teal);color:#fff;border-color:var(--teal)}
.gradepick button.sel.s-C{background:var(--slate);color:#fff;border-color:var(--slate)}
.gradepick button.sel.s-D{background:var(--clay);color:#fff;border-color:var(--clay)}
.gradepick button.sel.s-none{background:var(--pine);color:#fff;border-color:var(--pine)}
.gradedefs{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.gradedefs div{font-size:11.5px;color:var(--faint);line-height:1.5}
.gradedefs b{color:var(--muted);margin-right:5px;font-family:var(--mono)}
.gradeauto{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.gaTag{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px}
.gaTag.auto{background:var(--teal-soft);color:#1f5249}
.gaTag.manual{background:var(--amber-soft);color:#7a5410}
.temppick{display:flex;flex-wrap:wrap;gap:7px}
.temppick .tbtn{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer}
.temppick .tbtn[data-v=""].sel{background:var(--surface);border-color:var(--line);color:var(--faint)}
.temppick .tbtn.t-hot.sel{background:#FBDCD4;border-color:#C23F1F;color:#8a2c15}
.temppick .tbtn.t-warm.sel{background:#FCEAC5;border-color:#B97E27;color:#7a5410}
.temppick .tbtn.t-ice.sel{background:#DCEBFA;border-color:#2B6CB0;color:#1c4a78}
.temppick .tbtn.t-frozen.sel{background:#E3E1F5;border-color:#4A3F8C;color:#332b63}

/* sop step picker */
.soppick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.soppick button{
  border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 5px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:5px;transition:.12s;
}
.soppick .num{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--muted)}
.soppick small{font-size:10.5px;color:var(--muted);font-weight:600;line-height:1.2}
.soppick button.done{border-color:var(--teal);background:var(--teal-soft)}
.soppick button.done .num{color:var(--teal)}
.soppick button.cur{border-color:var(--amber);background:var(--amber);}
.soppick button.cur .num,.soppick button.cur small{color:#fff}

/* policy / claim rows */
.subcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;position:relative}
.subcard .del{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:8px;background:var(--danger-soft);color:var(--danger);display:flex;align-items:center;justify-content:center;font-size:17px}
.sopmini{width:36px;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--pine);font-size:16px;font-weight:700;flex:none}
.sopmini:active{transform:scale(.94)}
.sopmini[disabled]{opacity:.3}
.sopmini.del{color:var(--danger);background:var(--danger-soft);border-color:var(--danger-soft);position:static;width:36px;height:42px}
.addrow{
  width:100%;height:44px;border:1.5px dashed var(--line);border-radius:11px;color:var(--pine);font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:7px;background:var(--surface-2);
}
.addrow:active{transform:scale(.99)}

/* riders (附約) */
.riders{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.riders-h{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px}
.riderrow{border:1px solid var(--line-2);border-radius:10px;padding:8px;margin-bottom:8px;background:var(--surface-2)}
.riderrow .rtop{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.riderrow .rbot{display:flex;gap:7px}
.riderrow .rn{flex:1;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 11px;font-size:14.5px;background:var(--surface)}
.riderrow .rc,.riderrow .rp,.riderrow .rt{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 11px;font-size:14.5px;background:var(--surface)}
.field input[readonly]{background:var(--surface-2);color:var(--muted);cursor:not-allowed}
.field .hint{display:block;font-size:11.5px;color:var(--faint);font-weight:400;margin-top:5px;letter-spacing:0}
.riderrow .rx{width:38px;height:40px;border-radius:9px;background:var(--danger-soft);color:var(--danger);font-size:18px;font-weight:700;flex:none}
.addrider{width:100%;height:40px;border:1.5px dashed var(--line);border-radius:10px;color:var(--pine);font-weight:700;font-size:13.5px;background:var(--surface-2)}
.addrider:active{transform:scale(.99)}
.riderlist{padding:0 0 8px;border-bottom:1px solid var(--line-2)}
.rideritem{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2,#39423e);padding:2px 0 2px 6px}
.rideritem .rc{color:var(--muted);font-family:var(--mono);text-align:right;white-space:nowrap}

/* buttons */
.btn{height:48px;border-radius:12px;font-weight:700;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.full{width:100%}
.btn.green{background:var(--pine);color:#fff}
.btn.amber{background:var(--amber);color:#241A06}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.red{background:var(--danger-soft);color:var(--danger)}
.btnrow{display:flex;gap:10px;margin-top:8px}

/* detail */
.detail-hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:17px;margin-bottom:14px;box-shadow:var(--shadow)}
.detail-hero .top{display:flex;gap:13px;align-items:center}
.detail-hero h2{margin:0;font-size:22px}
.detail-hero .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.detail-hero .meta a{color:var(--pine);font-weight:600;text-decoration:none}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.kpi .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--pine)}
.kpi .l{font-size:11px;color:var(--muted);margin-top:2px}

.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:13px;overflow:hidden;box-shadow:var(--shadow)}
.block>h4{margin:0;padding:14px 16px;font-size:14px;font-weight:800;letter-spacing:.5px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:8px;background:var(--surface-2)}
.block>h4 .tag{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:600}
.block-body{padding:14px 16px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;text-align:right}

/* sop detail spine */
.sopfull{padding:6px 16px}
.sopstep{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line-2);cursor:pointer;border-radius:8px;transition:background .12s}
.sopstep:active{background:var(--surface-2)}
.sopstep:last-child{border:none}
.sopstep .badge{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:14px;background:var(--line);color:var(--muted)}
.sopstep.done .badge{background:var(--teal);color:#fff}
.sopstep.cur .badge{background:var(--amber);color:#fff}
.sopstep .t{font-weight:700;font-size:14px}
.sopstep.done .t,.sopstep.cur .t{color:var(--ink)}
.sopstep .t small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px;line-height:1.4}
.sopstep .sopedit{color:var(--faint);flex:none}
.sopstep.cur .sopedit{color:var(--amber)}

/* line templates */
.linebtn{
  width:100%;text-align:left;background:#06C755;color:#fff;border-radius:12px;padding:13px 15px;margin-bottom:9px;
  display:flex;align-items:center;gap:11px;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(6,199,85,.22);
}
.linebtn:active{transform:scale(.99)}
.linebtn .ic{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.linebtn small{display:block;font-weight:500;opacity:.9;font-size:12px;margin-top:2px}
.linepreview{
  background:#DCF8C6;border:1px solid #c9ecb4;border-radius:16px 16px 16px 5px;
  padding:13px 16px;font-size:14px;line-height:1.65;white-space:pre-wrap;color:#16321a;
  box-shadow:var(--shadow);
}

/* reminder list */
.remgroup{margin-bottom:18px}
.remgroup>h4{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:1px;margin:0 0 9px;display:flex;align-items:center;gap:8px}
.remgroup.over>h4{color:var(--danger)}
.remitem{
  display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);
}
.remitem .date{font-family:var(--mono);font-size:12px;font-weight:700;text-align:center;flex:none;width:46px;line-height:1.15}
.remitem .date b{display:block;font-size:18px;color:var(--pine)}
.remitem.over .date b{color:var(--danger)}
.remitem .body{flex:1;min-width:0}
.remitem .body .t{font-weight:700;font-size:14px}
.remitem .body .who{font-size:12.5px;color:var(--muted);margin-top:2px}
.remitem .type{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;flex:none}
.t-bday{background:var(--amber-soft);color:#7a5410}
.t-pay{background:var(--teal-soft);color:#1f5249}
.t-mat{background:#E7E0F0;color:#503b78}
.t-care{background:#E9EDEB;color:#475550}
.t-manual{background:#F0E7D8;color:#6b5326}
.t-visit{background:#E0623F;color:#fff;font-weight:800}
.t-google{background:#D2E3FC;color:#1a4fa0}

/* ---------- calendar ---------- */
.calbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.calbar .mtitle{font-weight:800;font-size:16px;font-family:var(--mono);letter-spacing:.5px;min-width:118px;text-align:center}
.calnav{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--pine)}
.calnav:active{transform:scale(.94)}
.caltoday{height:38px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--pine)}
.calbar .tb-btn.primary{margin-left:auto}
.calgrid{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.calhead{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface-2);border-bottom:1px solid var(--line)}
.calhead div{padding:9px 0;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.calhead .sun{color:#b85c5c}
.calweeks{display:grid;grid-template-columns:repeat(7,1fr)}
.calcell{min-height:78px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:5px 4px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.calcell:nth-child(7n){border-right:none}
.calcell:active{background:var(--surface-2)}
.calcell.out{background:var(--surface-2)}
.calcell.out .dn{color:var(--faint)}
.calcell .dn{font-size:12.5px;font-weight:700;font-family:var(--mono);width:23px;height:21px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.calcell .dn.sun{color:#b85c5c}
.calcell.today .dn{background:var(--pine);color:#fff;border-radius:7px}
.calchip{font-size:10px;font-weight:700;line-height:1.35;padding:1px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calmore{font-size:9.5px;color:var(--muted);font-weight:700;padding-left:4px}
.callegend{display:flex;flex-wrap:wrap;gap:14px;margin:12px 4px 0;justify-content:center}
.callegend .leg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.callegend .leg i{width:11px;height:11px;border-radius:4px;display:block}
.gcalstatus{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);cursor:pointer}
.gcalstatus.on{background:#EAF1FD;color:#1a4fa0;border-color:#C9DDFB;cursor:default}
@media(max-width:380px){.calcell{min-height:64px}.calchip{font-size:9px;padding:1px 3px}}
.checkbtn{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:transparent;font-size:16px}
.checkbtn:active{border-color:var(--teal)}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(78px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:80;
  opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow-lg);max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.warn{background:var(--amber);color:#241A06}
.toast.err{background:var(--danger)}

/* info card (説明) */
.info{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:13px;box-shadow:var(--shadow)}
.info h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:9px}
.info p{margin:0 0 10px;font-size:14px;color:var(--ink)}
.info ol,.info ul{margin:0;padding-left:20px;font-size:14px}
.info li{margin-bottom:7px}
.steplist{counter-reset:s;list-style:none;padding:0}
.steplist li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-2)}
.steplist li:last-child{border:none}
.steplist .n{counter-increment:s;font-family:var(--mono);font-weight:700;width:28px;height:28px;border-radius:8px;background:var(--pine);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.steplist .n::before{content:counter(s)}
.steplist b{font-size:14.5px}
.steplist small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}

textarea.raw{width:100%;min-height:160px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:11px;padding:11px;background:var(--surface-2);line-height:1.5}

/* ---------- mode toggle ---------- */
.cmode{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px}
.cmode button{height:34px;padding:0 15px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.cmode button.on{background:var(--pine);color:#fff}
.cmode svg{width:15px;height:15px}

/* ---------- kanban board ---------- */
.board{
  display:flex;gap:11px;overflow-x:auto;overflow-y:hidden;
  padding:2px 2px 10px;-webkit-overflow-scrolling:touch;
  scroll-snap-type:x proximity;
}
.kcol{
  flex:0 0 230px;width:230px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:15px;display:flex;flex-direction:column;
  max-height:calc(100dvh - 250px);scroll-snap-align:start;transition:background .12s,outline .12s;
}
.kcol.drop{outline:2px dashed var(--amber);outline-offset:-2px;background:var(--amber-soft)}
.kcol-head{
  padding:11px 13px;display:flex;align-items:center;gap:9px;flex:none;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface-2);
  border-radius:15px 15px 0 0;z-index:1;
}
.kcol-head .num{font-family:var(--mono);font-weight:700;width:25px;height:25px;border-radius:8px;background:var(--pine);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.kcol-head .t{flex:1;min-width:0;font-weight:700;font-size:13.5px;line-height:1.15}
.kcol-head .t small{display:block;font-weight:500;color:var(--muted);font-size:10px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcol-head .c{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 8px;flex:none}
.kcol-body{padding:9px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;display:flex;flex-direction:column;gap:8px;min-height:56px}
.kcard{
  background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;
  box-shadow:var(--shadow);position:relative;touch-action:auto;cursor:grab;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow:hidden;
}
.kcard .edge{position:absolute;left:0;top:0;bottom:0;width:4px}
.kcard h4{margin:0 0 4px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;padding-left:4px}
.kcard .meta{font-size:11.5px;color:var(--muted);padding-left:4px}
.kcard.dragging{opacity:.32}
.kcard.temp-hot{background:#FDECE7;border-color:#E0623F}
.kcard.temp-warm{background:#FDF3DC;border-color:#D9A64A}
.kcard.temp-ice{background:#E8F1FB;border-color:#6FA8DC}
.kcard.temp-frozen{background:#EDEBFA;border-color:#8C7FC9}
.ktemp{margin-left:auto;font-size:13px}
.kghost{position:fixed;z-index:90;pointer-events:none;transform:rotate(1.5deg) scale(1.02);box-shadow:var(--shadow-lg);cursor:grabbing;margin:0}
.kempty{color:var(--faint);font-size:12px;text-align:center;padding:18px 6px;border:1px dashed var(--line);border-radius:10px}
.boardhint{font-size:12px;color:var(--muted);margin:10px 2px 0;display:flex;align-items:center;gap:7px}
.dailytip{margin-bottom:12px}
.tiplist{display:flex;flex-direction:column;gap:2px}
.tiprow{display:flex;align-items:flex-start;gap:10px;padding:8px 4px;border-radius:9px}
.tiprow input[type="checkbox"]{width:19px;height:19px;flex:none;margin-top:1px;cursor:pointer}
.tiprow span{font-size:13.5px;color:var(--ink);line-height:1.5;cursor:pointer}
.tiprow span:hover{text-decoration:underline}

0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);

function sha256(msg){

  const l=msg.length, bitHi=Math.floor(l/0x20000000), bitLo=(l<<3)>>>0;
  const withOne=l+1, k=(56-(withOne%64)+64)%64, total=withOne+k+8;
  const buf=new Uint8Array(total); buf.set(msg,0); buf[l]=0x80;
  const dv=new DataView(buf.buffer);
  dv.setUint32(total-8,bitHi>>>0,false); dv.setUint32(total-4,bitLo>>>0,false);
  const w=new Uint32Array(64); const ROTR=(n,x)=>((x>>>n)|(x<<(32-n)))>>>0;
  for(let off=0;off<total;off+=64){
    for(let i=0;i<16;i++) w[i]=dv.getUint32(off+i*4,false);
    for(let i=16;i<64;i++){
      const a=w[i-15],b=w[i-2];
      const s0=ROTR(7,a)^ROTR(18,a)^(a>>>3);
      const s1=ROTR(17,b)^ROTR(19,b)^(b>>>10);

    }
    let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
    for(let i=0;i<64;i++){
      const S1=ROTR(6,e)^ROTR(11,e)^ROTR(25,e);
      const ch=(e&f)^((~e)&g);
      const t1=(h+S1+ch+K256[i]+w[i])>>>0;
      const S0=ROTR(2,a)^ROTR(13,a)^ROTR(22,a);
      const maj=(a&b)^(a&c)^(b&c);
      const t2=(S0+maj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }

  }

}
function concatU8(){ let n=0; for(const a of arguments) n+=a.length; const o=new Uint8Array(n); let p=0; for(const a of arguments){ o.set(a,p); p+=a.length; } return o; }

function pbkdf2(pw,salt,iter,dkLen){
  const hLen=32, blocks=Math.ceil(dkLen/hLen), out=new Uint8Array(blocks*hLen);
  for(let b=1;b<=blocks;b++){

    let u=hmacSha256(pw,concatU8(salt,ib)); const t=u.slice();
    for(let i=1;i<iter;i++){ u=hmacSha256(pw,u); for(let j=0;j<hLen;j++) t[j]^=u[j]; }
    out.set(t,(b-1)*hLen);
  }
  return out.slice(0,dkLen);
}
function chacha20(key,nonce,counter,data){
  const out=new Uint8Array(data.length);
  const le=(a,i)=>((a[i]|(a[i+1]<<8)|(a[i+2]<<16)|(a[i+3]<<24))>>>0);
  const ROTL=(x,n)=>(((x<<n)|(x>>>(32-n)))>>>0);

      x[c]=(x[c]+x[d])>>>0; x[b]=ROTL(x[b]^x[c],12);
      x[a]=(x[a]+x[b])>>>0; x[d]=ROTL(x[d]^x[a],8);
      x[c]=(x[c]+x[d])>>>0; x[b]=ROTL(x[b]^x[c],7);
    };
    for(let i=0;i<10;i++){
      QR(0,4,8,12);QR(1,5,9,13);QR(2,6,10,14);QR(3,7,11,15);
      QR(0,5,10,15);QR(1,6,11,12);QR(2,7,8,13);QR(3,4,9,14);
    }
    const ks=new Uint8Array(64), dv=new DataView(ks.buffer);
    for(let i=0;i<16;i++) dv.setUint32(i*4,(x[i]+s[i])>>>0,true);
    return ks;
  }

  for(let off=0;off<data.length;off+=64){
    const ks=block(ctr++); const n=Math.min(64,data.length-off);
    for(let i=0;i<n;i++) out[off+i]=data[off+i]^ks[i];
  }

}
function ctEqual(a,b){ if(a.length!==b.length) return false; let r=0; for(let i=0;i<a.length;i++) r|=a[i]^b[i]; return r===0; }

/* ---- helpers ---- */
const ITER=30000;
function utf8(s){ return new TextEncoder().encode(s); }
function utf8dec(u){ return new TextDecoder().decode(u); }
function randomBytes(n){ const a=new Uint8Array(n);
  if(typeof crypto!=="undefined" && crypto.getRandomValues) crypto.getRandomValues(a);
  else for(let i=0;i<n;i++) a[i]=Math.floor(Math.random()*256);
  return a; }
function b64(u){ let s=""; for(let i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); }
function ub64(str){ const s=atob(str); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }

// derive enc + mac keys: one PBKDF2 master (32B), then HKDF-style expand (cheap)
function deriveKeys(pw,salt,iter){
  const master=pbkdf2(pw,salt,iter,32);
  const encKey=hmacSha256(master,utf8("insure-crm-enc"));
  const macKey=hmacSha256(master,utf8("insure-crm-mac"));
  return {encKey,macKey};
}
function encryptPayload(plainStr,password){
  const salt=randomBytes(16), nonce=randomBytes(12), pw=utf8(password);
  const {encKey,macKey}=deriveKeys(pw,salt,ITER);
  const ct=chacha20(encKey,nonce,1,utf8(plainStr));
  const mac=hmacSha256(macKey,concatU8(salt,nonce,ct));
  return {app:"insure-crm",enc:1,alg:"chacha20-hmacsha256",kdf:"pbkdf2-sha256-hkdf",iter:ITER,

function decryptPayload(env,password){
  const salt=ub64(env.salt),nonce=ub64(env.nonce),ct=ub64(env.ct),mac=ub64(env.mac),pw=utf8(password);
  const {encKey,macKey}=deriveKeys(pw,salt,env.iter||ITER);
  if(!ctEqual(mac,hmacSha256(macKey,concatU8(salt,nonce,ct)))) throw new Error("BAD_PASSWORD");
  return utf8dec(chacha20(encKey,nonce,1,ct));

const PAYFREQ_MONTHS = {"年繳":12,"半年繳":6,"季繳":3,"月繳":1};
function nextPaymentDate(startISO, freq){
  if(!startISO) return "";
  if(freq==="躉繳") return startISO;
  const start=new Date(startISO+"T00:00:00");
  if(isNaN(start.getTime())) return "";
  const months=PAYFREQ_MONTHS[freq]||12;
  const t=new Date(); t.setHours(0,0,0,0);
  let cand=new Date(start);
  if(cand<t){
    const diffMonths=(t.getFullYear()-cand.getFullYear())*12+(t.getMonth()-cand.getMonth());
    let steps=Math.floor(diffMonths/months); if(steps<0) steps=0;
    cand=new Date(start); cand.setMonth(cand.getMonth()+steps*months);
    while(cand<t) cand.setMonth(cand.getMonth()+months);
  }
  return cand.toLocaleDateString("sv");
}
function numVal(s){ return parseFloat(String(s||"").replace(/[, ]/g,""))||0; }
function parseYearsNum(str){
  if(!str) return null;
  const m=String(str).match(/(\d+(?:\.\d+)?)/);
  return m? parseFloat(m[1]) : null;
}
function addYearsISO(dateISO, years){
  if(!dateISO || years==null || isNaN(years)) return "";
  const d=new Date(dateISO+"T00:00:00");
  if(isNaN(d.getTime())) return "";
  const whole=Math.floor(years);
  const fracMonths=Math.round((years-whole)*12);
  d.setFullYear(d.getFullYear()+whole);
  if(fracMonths) d.setMonth(d.getMonth()+fracMonths);
  return d.toLocaleDateString("sv");
}
function activeRiders(p){
  return (p.riders||[]).filter(r=>(r.name||"").trim()||(r.coverage||"").trim()||(r.premium||"").trim()||(r.term||"").trim());
}
function policyPaymentCutoffISO(p){
  // null = 永續（有1年期附約，持續顯示下次繳費日）；"" = 無法判斷（不設限）；否則為實際截止日
  const riders=activeRiders(p);
  if(!riders.length) return p.maturityDate || "";
  const hasPerpetual=riders.some(r=>{ const y=parseYearsNum(r.term); return y!=null && Math.abs(y-1)<0.01; });
  if(hasPerpetual) return null;
  let maxYears=parseYearsNum(p.term)||0;
  riders.forEach(r=>{ const y=parseYearsNum(r.term); if(y!=null && y>maxYears) maxYears=y; });
  if(p.startDate && maxYears>0) return addYearsISO(p.startDate, maxYears);
  return p.maturityDate || "";
}
function policyPaymentActive(p){
  const cutoff=policyPaymentCutoffISO(p);
  if(cutoff===null || !cutoff) return true;
  return todayISO()<=cutoff;
}

/* ---------- tag drag reorder ---------- */
let tmDragEl=null, tmDragRAF=null, tmDragLastY=0;
function tmDragStart(e, el){
  if(!el) return;
  e.preventDefault();
  tmDragEl=el;
  el.classList.add("dragging");
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
  el.addEventListener("pointermove", tmDragMove);
  el.addEventListener("pointerup", tmDragEnd);
  el.addEventListener("pointercancel", tmDragEnd);
}
function tmDragMove(e){
  if(!tmDragEl) return;
  tmDragLastY=e.clientY;
  if(tmDragRAF) return;
  tmDragRAF=requestAnimationFrame(tmDragFrame);
}
function tmDragFrame(){
  tmDragRAF=null;
  if(!tmDragEl) return;
  const clientY=tmDragLastY;
  const container=tmDragEl.parentElement; if(!container) return;
  const rows=[...container.children].filter(r=>r!==tmDragEl);
  let insertBefore=null;
  for(const r of rows){
    const rect=r.getBoundingClientRect();
    if(clientY < rect.top+rect.height/2){ insertBefore=r; break; }
  }
  if(insertBefore){ if(insertBefore!==tmDragEl.nextSibling) container.insertBefore(tmDragEl, insertBefore); }
  else { if(container.lastElementChild!==tmDragEl) container.appendChild(tmDragEl); }
  const rect=tmDragEl.getBoundingClientRect();
  const offset=clientY-(rect.top+rect.height/2);
  tmDragEl.style.transform=`translateY(${offset}px)`;
}
function tmDragEnd(e){
  if(!tmDragEl) return;
  if(tmDragRAF){ cancelAnimationFrame(tmDragRAF); tmDragRAF=null; }
  try{ tmDragEl.releasePointerCapture(e.pointerId); }catch(err){}
  tmDragEl.removeEventListener("pointermove", tmDragMove);
  tmDragEl.removeEventListener("pointerup", tmDragEnd);
  tmDragEl.removeEventListener("pointercancel", tmDragEnd);
  tmDragEl.style.transform="";
  tmDragEl.classList.remove("dragging");
  const container=tmDragEl.parentElement;
  tmDragEl=null;
  if(!container) return;
  const newOrder=[...container.querySelectorAll(".tmrow")].map(r=>r.dataset.tag);
  DB.tagCatalog=newOrder;
  commit();
}
function renameTagPrompt(t){
  tagBeingRenamed=t;
  openSheet("重新命名標籤", `
    <div class="field"><label>目前名稱</label><input value="${esc(t)}" disabled></div>
    <div class="field"><label>新名稱</label><input id="tmNewName" value="${esc(t)}" placeholder="輸入新的標籤名稱"></div>
    <p style="color:var(--muted);font-size:12.5px;margin:-4px 0 14px">若改成和現有標籤相同的名稱，兩個標籤會自動合併成一個，適合用來整併相近的標籤。</p>
    <button class="btn green full" onclick="doRenameTag()">確認重新命名</button>
  `);
}
function doRenameTag(){
  const oldT=tagBeingRenamed; if(!oldT) return;
  const newT=($("#tmNewName")||{}).value?.trim();
  if(!newT){ toast("請輸入新名稱","warn"); return; }
  if(newT===oldT){ closeSheet(); return; }
  DB.clients.forEach(c=>{
    if(!Array.isArray(c.tags)||!c.tags.includes(oldT)) return;
    c.tags=c.tags.filter(x=>x!==oldT);
    if(!c.tags.includes(newT)) c.tags.push(newT);
  });
  DB.tagCatalog=(DB.tagCatalog||[]).filter(x=>x!==oldT);
  if(!DB.tagCatalog.includes(newT)) DB.tagCatalog.push(newT);
  tagBeingRenamed=null;
  commit(); closeSheet();
  toast("已更新標籤");
  if(view==="guide") refreshTagManageList(); else render();
}

  `);
}
function doDeleteTag(){
  const t=tagBeingDeleted; if(!t) return;
  DB.clients.forEach(c=>{ if(Array.isArray(c.tags)) c.tags=c.tags.filter(x=>x!==t); });
  DB.tagCatalog=(DB.tagCatalog||[]).filter(x=>x!==t);
  tagFilter=tagFilter.filter(x=>x!==t);
  tagBeingDeleted=null;
  commit(); closeSheet();
  toast("已刪除標籤");
  if(view==="guide") refreshTagManageList(); else render();
}

/* ---------- Google Calendar sync ---------- */
const GCAL_SCOPE="https://www.googleapis.com/auth/calendar.events";
const GCAL_CID_KEY="insure_crm_gcal_cid";
const GCAL_WORK_CID_KEY="insure_crm_gcal_work_cid";
const GCAL_CONNECTED_KEY="insure_crm_gcal_connected";
let gcalTokenClient=null;
let gcalAccessToken=null;
let gcalTokenExpiry=0;
let gcalEventsCache={};   // "YYYY-M0" -> array of {id,title,date,time,allDay}
let gcalLoadingMonth=null;
function gcalClientId(){ try{ return localStorage.getItem(GCAL_CID_KEY)||""; }catch(e){ return ""; } }
function gcalSetClientId(id){ try{ localStorage.setItem(GCAL_CID_KEY, id||""); }catch(e){} }
function gcalWorkCalId(){ try{ return localStorage.getItem(GCAL_WORK_CID_KEY)||""; }catch(e){ return ""; } }
function gcalSetWorkCalId(id){ try{ localStorage.setItem(GCAL_WORK_CID_KEY, id||""); }catch(e){} }
function gcalIsConnected(){ return !!gcalAccessToken && Date.now()<gcalTokenExpiry; }
function gcalPushEnabled(){ return DB.meta.gcalPushVisits!==false; }
function gcalReady(){ return typeof google!=="undefined" && google.accounts && google.accounts.oauth2; }

function gcalConnect(silent){
  const fieldVal=(($("#setGcalCid")||{}).value||"").trim();
  const cid=fieldVal || gcalClientId();
  if(!cid){ if(!silent) toast("請先貼上 Google 用戶端 ID","warn"); return; }
  gcalSetClientId(cid);
  if(!gcalReady()){ if(!silent) toast("Google 服務載入中，請稍後再試","warn"); return; }
  try{
    gcalTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: cid,
      scope: GCAL_SCOPE,
      callback: (resp)=>{
        if(!resp || resp.error){ if(!silent) toast("Google 授權失敗，請重試","err"); return; }
        gcalAccessToken = resp.access_token;
        gcalTokenExpiry = Date.now() + ((resp.expires_in||3500)*1000) - 60000;
        gcalEventsCache = {};
        try{ localStorage.setItem(GCAL_CONNECTED_KEY,"1"); }catch(e){}
        if(!silent) toast("已連接 Google 行事曆");
        render();
      }
    });
    gcalTokenClient.requestAccessToken({prompt: silent?"":"consent"});
  }catch(e){ if(!silent) toast("Google 授權初始化失敗","err"); }
}
function gcalDisconnect(){
  try{ if(gcalAccessToken && gcalReady()) google.accounts.oauth2.revoke(gcalAccessToken,()=>{}); }catch(e){}
  gcalAccessToken=null; gcalTokenExpiry=0; gcalEventsCache={};
  try{ localStorage.removeItem(GCAL_CONNECTED_KEY); }catch(e){}
  toast("已中斷 Google 行事曆連接"); render();
}
function gcalTogglePush(on){ DB.meta.gcalPushVisits = !!on; commit(); render(); }
function gcalSaveWorkCalId(v){ gcalSetWorkCalId((v||"").trim()); gcalEventsCache={}; toast("已儲存工作行事曆設定"); if(view==="reminders") render(); }

async function gcalFetchMonth(y,m0){
  const key=`${y}-${m0}`;
  if(!gcalIsConnected() || gcalEventsCache[key] || gcalLoadingMonth===key) return;
  gcalLoadingMonth=key;
  try{
    const start=new Date(y,m0,1), end=new Date(y,m0+1,0,23,59,59);
    const params=new URLSearchParams({
      timeMin:start.toISOString(), timeMax:end.toISOString(),
      singleEvents:"true", orderBy:"startTime", maxResults:"250"
    });
    const calIds=["primary"];
    const workCid=gcalWorkCalId();
    if(workCid && workCid!=="primary") calIds.push(workCid);
    const results=await Promise.all(calIds.map(async cid=>{
      try{
        const res=await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cid)}/events?`+params.toString(),
          { headers:{ Authorization:"Bearer "+gcalAccessToken } });
        if(res.status===401) return {auth401:true, items:[]};
        const data=await res.json();
        return {items:data.items||[]};
      }catch(e){ return {items:[]}; }
    }));
    if(results.some(r=>r.auth401)){ gcalAccessToken=null; gcalTokenExpiry=0; gcalLoadingMonth=null; render(); return; }
    const merged=[];
    results.forEach(r=>{
      (r.items||[]).filter(e=>e.status!=="cancelled").forEach(ev=>{
        const date=ev.start&&(ev.start.date||(ev.start.dateTime||"").slice(0,10))||"";
        if(!date) return;
        merged.push({
          id: ev.id,
          title: ev.summary||"(無標題)",
          date,
          time: ev.start&&ev.start.dateTime? ev.start.dateTime.slice(11,16) : "",
          allDay: !!(ev.start&&ev.start.date)
        });
      });
    });
    gcalEventsCache[key]=merged;
  }catch(e){ gcalEventsCache[key]=[]; }
  gcalLoadingMonth=null;
  if(view==="reminders" && calY===y && calM===m0) render();
}
function gcalEventBody(title,note,dateISO,startTime,endTime){
  if(startTime){
    const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
    return { summary:title, description:note||"",
      start:{dateTime:`${dateISO}T${startTime}:00`, timeZone:tz},
      end:{dateTime:`${dateISO}T${endTime||startTime}:00`, timeZone:tz} };
  }
  return { summary:title, description:note||"", start:{date:dateISO}, end:{date:dateISO} };
}
async function gcalPushVisit(cid,rid,title,dateISO,note,startTime,endTime){
  if(!gcalIsConnected() || !gcalPushEnabled()) return;
  const targetCal=gcalWorkCalId()||"primary";
  try{
    const res=await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(targetCal)}/events`,{
      method:"POST",
      headers:{ Authorization:"Bearer "+gcalAccessToken, "Content-Type":"application/json" },
      body:JSON.stringify(gcalEventBody(title,note,dateISO,startTime,endTime))
    });
    const data=await res.json();
    if(data.id){
      const c=DB.clients.find(x=>x.id===cid); const r=c&&(c.reminders||[]).find(x=>x.id===rid);
      if(r){ r.gcalEventId=data.id; r.gcalCalId=targetCal; commit(false); }
      gcalEventsCache={};
      if(view==="reminders") render();
    }
  }catch(e){}
}
async function gcalUpdateVisitEvent(r, clientName){
  if(!gcalIsConnected() || !r || !r.gcalEventId) return;
  const calId=r.gcalCalId||"primary";
  const title=`${r.title||"複訪"}（${clientName||""}）`;
  try{
    await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events/${r.gcalEventId}`,{
      method:"PATCH",
      headers:{ Authorization:"Bearer "+gcalAccessToken, "Content-Type":"application/json" },
      body:JSON.stringify(gcalEventBody(title, r.note, r.date, r.startTime, r.endTime))
    });
    gcalEventsCache={};
  }catch(e){}
}
async function gcalDeleteEvent(eventId, calId){
  if(!gcalIsConnected() || !eventId) return;
  try{
    await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId||"primary")}/events/${eventId}`,
      { method:"DELETE", headers:{ Authorization:"Bearer "+gcalAccessToken } });
    gcalEventsCache={};
  }catch(e){}
}
const KEY = "insure_crm_v2";

/* ============ utils ============ */
const $ = s => document.querySelector(s);
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO = () => new Date().toLocaleDateString("sv");  // YYYY-MM-DD local
function pad(n){return String(n).padStart(2,"0")}
function fmtDate(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${y}/${m}/${d}`; }

/* ---------- date input: 西元/民國 toggle, manual entry + native picker ---------- */
let dateCalMode = (function(){ try{ return localStorage.getItem("insure_crm_date_mode")||"AD"; }catch(e){ return "AD"; } })();
function dtPlaceholder(){ return dateCalMode==="ROC" ? "民國年/月/日，例 113/1/1" : "西元年/月/日，例 2024/1/1"; }
function isoToDisp(iso){
  if(!iso) return "";
  const p=iso.split("-"); if(p.length<3) return "";
  let y=+p[0], m=+p[1], d=+p[2];
  if(dateCalMode==="ROC") y=y-1911;
  return `${y}/${m}/${d}`;
}
function dispToISO(str){
  if(!str||!str.trim()) return "";
  const t=str.trim().replace(/[年.]/g,"/").replace(/月/g,"/").replace(/日/g,"").replace(/[\/\-]+/g,"/");
  const parts=t.split("/").map(s=>s.trim()).filter(Boolean);
  if(parts.length<3) return null;
  let [y,m,d]=parts.map(Number);
  if(!y||!m||!d) return null;
  if(dateCalMode==="ROC") y=y+1911;
  if(y<1911||y>2100||m<1||m>12||d<1||d>31) return null;
  const iso=`${y}-${pad(m)}-${pad(d)}`;
  const chk=new Date(iso+"T00:00:00");
  if(chk.getFullYear()!==y || chk.getMonth()+1!==m || chk.getDate()!==d) return null;
  return iso;
}
function toggleDateCalMode(){
  dateCalMode = dateCalMode==="ROC"?"AD":"ROC";
  try{ localStorage.setItem("insure_crm_date_mode", dateCalMode); }catch(e){}
  document.querySelectorAll(".datefield").forEach(wrap=>{
    const hidden=wrap.querySelector('input[type="date"]');
    const disp=wrap.querySelector(".dtinput");
    if(!hidden||!disp) return;
    disp.value = isoToDisp(hidden.value);
    disp.placeholder = dtPlaceholder();
    const btn=wrap.querySelector(".dtoggle");
    if(btn) btn.textContent = dateCalMode==="ROC"?"切換西元":"切換民國";
  });
}
function dtSync(id){
  const disp=$(`#${id}_disp`), hidden=$(`#${id}`), err=$(`#${id}_err`);
  if(!disp||!hidden) return;
  const raw=disp.value;
  const iso=dispToISO(raw);
  if(iso===null){ if(err) err.classList.remove("hide"); return; }
  if(err) err.classList.add("hide");
  hidden.value=iso;
  hidden.dispatchEvent(new Event("change"));
}
function dtClearErr(id){ const err=$(`#${id}_err`); if(err) err.classList.add("hide"); }
function dtFromPicker(id){ const hidden=$(`#${id}`), disp=$(`#${id}_disp`), err=$(`#${id}_err`); if(disp) disp.value=isoToDisp(hidden.value); if(err) err.classList.add("hide"); }
function dtPick(id){ const hidden=$(`#${id}`); if(!hidden) return; if(hidden.showPicker){ try{ hidden.showPicker(); return; }catch(e){} } hidden.focus(); hidden.click(); }
function dateFieldHtml(id, iso, label, onchangeExpr, hint){
  return `<div class="field datefield">
    <label>${label}<button type="button" class="dtoggle" onclick="toggleDateCalMode()">${dateCalMode==="ROC"?"切換西元":"切換民國"}</button></label>
    <div class="dtrow">
      <input type="text" inputmode="numeric" autocomplete="off" class="dtinput" id="${id}_disp" placeholder="${dtPlaceholder()}" value="${esc(isoToDisp(iso))}" onchange="dtSync('${id}')" oninput="dtClearErr('${id}')">
      <button type="button" class="dtpick" onclick="dtPick('${id}')" title="從日曆選擇">📅</button>
    </div>
    ${hint?`<div class="hint" style="margin-top:6px">${hint}</div>`:""}
    <div class="dterr hide" id="${id}_err">日期格式不正確，請確認</div>
    <input type="date" id="${id}" class="hide" value="${esc(iso||"")}" onchange="dtFromPicker('${id}');${onchangeExpr||""}">
  </div>`;
}
function initial(name){ if(!name) return "？"; return name.trim().slice(-2); }
function daysBetween(aISO,bISO){ return Math.round((new Date(bISO)-new Date(aISO))/864e5); }

function nextOccur(monthDay){ // monthDay = "MM-DD" -> next YYYY-MM-DD >= today
  if(!monthDay) return null;
  const [mm,dd]=monthDay.split("-").map(Number);
  if(!mm||!dd) return null;
  const t=new Date(); t.setHours(0,0,0,0);
  let y=t.getFullYear();
  let cand=new Date(y, mm-1, dd);
  if(cand<t){ cand=new Date(y+1, mm-1, dd); }
  return cand.toLocaleDateString("sv");
}
function mdFromISO(iso){ if(!iso) return null; const p=iso.split("-"); return p.length>=3?`${p[1]}-${p[2]}`:null; }

function migrate(d){
  d = d||{};
  d.meta = Object.assign({brand:"保險客戶資料庫",agent:"",updatedAt:null,schema:2}, d.meta||{});
  d.meta.gradeDefs = Object.assign({}, DEFAULT_GRADE_DEFS, d.meta.gradeDefs||{});
  d.clients = Array.isArray(d.clients)?d.clients:[];
  d.tagCatalog = Array.isArray(d.tagCatalog)?d.tagCatalog:[];
  d.groupProjectCatalog = Array.isArray(d.groupProjectCatalog)?d.groupProjectCatalog:[];
  d.ownerChangeLog = Array.isArray(d.ownerChangeLog)?d.ownerChangeLog:[];
  d.groupRenewalLog = Array.isArray(d.groupRenewalLog)?d.groupRenewalLog:[];
  d.clients.forEach(c=>{
    c.policies=c.policies||[]; c.reminders=c.reminders||[]; c.claims=c.claims||[]; c.careLog=c.careLog||[];
    c.sopStatus=c.sopStatus||{}; if(typeof c.sopStep!=="number") c.sopStep=1;
    if(c.grade==null) c.grade="";
    if(c.gradeAuto==null) c.gradeAuto = !c.grade;
    if(c.giftDesk==null) c.giftDesk=false;
    if(c.giftWall==null) c.giftWall=false;
    if(c.giftOther==null) c.giftOther=false;
    if(c.giftOtherText==null) c.giftOtherText="";
    if(!Array.isArray(c.tags)){ c.tags = c.region ? [c.region] : []; }
    c.tags = c.tags.map(t=>(t||"").trim()).filter(Boolean);
    delete c.region;
    c.tags.forEach(t=>{ if(!d.tagCatalog.includes(t)) d.tagCatalog.push(t); });
    if(c.referrerId==null) c.referrerId="";
    if(c.referrerName==null) c.referrerName="";
    c.policies.forEach(p=>{
      if(p.mainName==null) p.mainName = p.name!=null ? p.name : "";
      if(p.category==null) p.category = p.type!=null ? p.type : "";
      if(p.category==="重大疾病") p.category="重大（特定）疾（傷）病";
      delete p.name; delete p.type;
      if(p.payFreq==null) p.payFreq="";
      if(p.insured==null) p.insured="";
      if(p.insuredRel==null) p.insuredRel="";
      if(p.coverage==null) p.coverage="";
      if(p.term==null) p.term="";
      if(p.notes==null) p.notes="";
      if(p.groupProject==null) p.groupProject="";
      if(p.groupProject && !d.groupProjectCatalog.includes(p.groupProject)) d.groupProjectCatalog.push(p.groupProject);
      p.riders=(p.riders||[]).map(r=>({name:r.name||"",coverage:r.coverage||"",premium:r.premium||"",term:r.term||""}));
      const total=numVal(p.premium)+p.riders.reduce((s,r)=>s+numVal(r.premium),0);
      p.totalPremium = total? String(total) : "";
    });
  });
  return d;
}

function currentTemp(c){
  let latest=null, latestDate="";
  (c.careLog||[]).forEach(e=>{ if(e.temp && e.date && e.date>=latestDate){ latestDate=e.date; latest=e.temp; } });
  Object.keys(c.sopStatus||{}).forEach(k=>{ const e=c.sopStatus[k]; if(e&&e.temp&&e.date&&e.date>=latestDate){ latestDate=e.date; latest=e.temp; } });
  return latest;
}
function computeAutoGrade(c){
  const hasGroup=(c.policies||[]).some(p=>p.groupProject);
  const nonGroupCount=(c.policies||[]).filter(p=>!p.groupProject).length;
  let refNonGroup=0, refGroup=0;
  DB.clients.forEach(x=>{
    if(x.id===c.id || x.referrerId!==c.id) return;
    if((x.policies||[]).some(p=>!p.groupProject)) refNonGroup++;
    if((x.policies||[]).some(p=>p.groupProject)) refGroup++;
  });
  if(nonGroupCount>=5 || refNonGroup>=5 || refGroup>=10) return "A";
  if(nonGroupCount>=3 || refNonGroup>=3 || refGroup>=5) return "B";
  if(nonGroupCount>=1 || refNonGroup>=1 || refGroup>=3) return "C";
  if(hasGroup) return "D";
  return "";
}
function recalcAllGrades(){
  DB.clients.forEach(c=>{ if(c.gradeAuto!==false) c.grade=computeAutoGrade(c); });
}
function commit(markDirty=true){

async function finishExport(text, fname, encrypted){
  const blob=new Blob([text],{type:"application/json"});
  closeSheet();
  try{
    const file=new File([blob],fname,{type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"客戶資料備份"});
      markSaved(); toast(encrypted?"已加密匯出，選「儲存到檔案」":"已開啟分享，選「儲存到檔案」"); return;
    }
  }catch(e){ if(e && e.name==="AbortError"){ return; } }
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    markSaved(); toast((encrypted?"已加密匯出 ":"已匯出 ")+fname);
  }catch(e){ openRawExport(text, fname); }
}

/* ============ reminders (auto derived + manual) ============ */
function autoReminders(c){
  const out=[];
  const bmd = mdFromISO(c.birthday);
  if(bmd){ const d=nextOccur(bmd); if(d) out.push({date:d, type:"bday", title:"生日關懷", who:c.name, clientId:c.id, auto:true}); }
  (c.policies||[]).forEach(p=>{
    const payMd = mdFromISO(p.paymentDate)||mdFromISO(p.startDate);
    if(payMd && policyPaymentActive(p)){ const d=nextOccur(payMd); if(d) out.push({date:d, type:"pay", title:`${p.mainName||"保單"} 繳費／周年`, who:c.name, clientId:c.id, auto:true}); }
    if(p.maturityDate && p.maturityDate>=todayISO()){
      out.push({date:p.maturityDate, type:"mat", title:`${p.mainName||"保單"} 滿期`, who:c.name, clientId:c.id, auto:true});
    }
  });
  return out;
}
function allReminders(){
  const list=[];
  DB.clients.forEach(c=>{
    autoReminders(c).forEach(r=>list.push(r));
    (c.reminders||[]).filter(r=>!r.done).forEach(r=>list.push({date:r.date,type:r.kind||"manual",title:r.title,who:c.name,clientId:c.id,id:r.id,note:r.note,startTime:r.startTime,endTime:r.endTime}));
  });
  return list.sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
}
/* events for a given month (recurring birthdays/payments expanded into that month) */
function eventsInMonth(y, m0){  // m0: 0-11
  const mm=pad(m0+1); const ev=[];
  DB.clients.forEach(c=>{
    const b=mdFromISO(c.birthday);
    if(b && b.slice(0,2)===mm) ev.push({date:`${y}-${b}`, type:"bday", title:"生日", who:c.name, clientId:c.id});
    (c.policies||[]).forEach(p=>{
      const payMd=mdFromISO(p.paymentDate)||mdFromISO(p.startDate);
      if(payMd && payMd.slice(0,2)===mm && policyPaymentActive(p)) ev.push({date:`${y}-${payMd}`, type:"pay", title:`${p.mainName||"保單"} 繳費／周年`, who:c.name, clientId:c.id});
      if(p.maturityDate){ const a=p.maturityDate.split("-"); if(+a[0]===y && a[1]===mm) ev.push({date:p.maturityDate, type:"mat", title:`${p.mainName||"保單"} 滿期`, who:c.name, clientId:c.id}); }
    });
    (c.reminders||[]).filter(r=>!r.done && r.date).forEach(r=>{ const a=r.date.split("-"); if(+a[0]===y && a[1]===mm) ev.push({date:r.date, type:r.kind||"manual", title:r.title, who:c.name, clientId:c.id, id:r.id, note:r.note}); });
  });
  return ev;
}

function todayDismissKey(){ return "insure_crm_tip_dismiss_"+todayISO(); }
function getDismissedTips(){
  try{ return JSON.parse(localStorage.getItem(todayDismissKey())||"[]"); }catch(e){ return []; }
}
function dismissTip(id){
  try{
    const arr=getDismissedTips();
    if(!arr.includes(id)){ arr.push(id); localStorage.setItem(todayDismissKey(), JSON.stringify(arr)); }
  }catch(e){}
}
function tipCheck(el,id,kind,cid,rid){
  if(!el.checked) return;
  if(kind==="reminder"){ doneEvent(cid,rid); return; }
  dismissTip(id);
  render();
}
function dailyTipHtml(){
  const t=todayISO();
  const dismissed=new Set(getDismissedTips());
  const items=[];
  allReminders().forEach(r=>{
    if(!r.id || r.date>t) return;
    const tag=r.date<t?"逾期":"今天";
    items.push({id:`rem-${r.id}`, kind:"reminder", cid:r.clientId, rid:r.id, priority:r.date<t?0:1,
      label:`${tag}：${esc(r.who)} — ${esc(r.title)}`});
  });
  DB.clients.forEach(c=>{
    if(currentTemp(c)!=="hot") return;
    const lc=lastContactDate(c);
    const days=lc? daysBetween(lc,t) : 9999;
    if(days>=7){ const id=`stale-${c.id}`; if(!dismissed.has(id)) items.push({id, kind:"tip", cid:c.id, priority:2, label:`🔥 ${esc(c.name)} 已 ${days>=9999?"很久":days} 天沒聯繫，建議優先跟進`}); }
  });
  DB.clients.forEach(c=>{
    if(c.sopStep>1 || (c.sopStatus&&Object.keys(c.sopStatus).length)) return;
    const id=`nosop-${c.id}`; if(!dismissed.has(id)) items.push({id, kind:"tip", cid:c.id, priority:3, label:`🆕 ${esc(c.name)} 還沒開始 SOP 流程，建議去跟進`});
  });
  DB.clients.forEach(c=>{
    if(c.grade) return;
    const id=`nograde-${c.id}`; if(!dismissed.has(id)) items.push({id, kind:"tip", cid:c.id, priority:4, label:`🏷️ ${esc(c.name)} 還沒有分級，建議去評估`});
  });
  items.sort((a,b)=>a.priority-b.priority);
  const shown=items.slice(0,8);
  if(!shown.length) return "";
  return `<div class="info dailytip">
    <h3>💡 近期作業小提醒</h3>
    <div class="tiplist">
      ${shown.map(it=>`<label class="tiprow">
        <input type="checkbox" onclick="tipCheck(this,'${it.id}','${it.kind}','${it.cid}'${it.rid?`,'${it.rid}'`:""})">
        <span onclick="event.preventDefault();event.stopPropagation();openDetail('${it.cid}')">${it.label}</span>
      </label>`).join("")}
    </div>
  </div>`;
}
