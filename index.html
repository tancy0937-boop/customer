<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作習慣養成追蹤系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1EFE7;
    --surface:#FFFFFF;
    --surface-soft:#F7F5EF;
    --ink:#252821;
    --ink-soft:#666A5C;
    --line:#DAD5C4;
    --accent:#2F5D53;
    --accent-soft:#E1EBE6;
    --accent-strong:#20443C;
    --manager:#8B5E34;
    --manager-soft:#F3E6D4;
    --manager-strong:#6E4826;
    --danger:#A6483A;
    --good:#4C7A5B;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
    font-weight:700;
    color:var(--accent-strong);
    margin:0 0 .4em 0;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px 80px;}

  .topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
  .topbar-inner{max-width:1040px;margin:0 auto;padding:18px 20px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .title-block h1{font-size:22px;margin-bottom:2px;}
  .title-block p{color:var(--ink-soft);font-size:13.5px;margin:0;}
  .auth-block{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
  .mode-pill{font-size:12.5px;padding:4px 11px;border-radius:100px;display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap;}
  .mode-pill.view{background:var(--surface-soft);color:var(--ink-soft);border:1px solid var(--line);}
  .mode-pill.mgr{background:var(--manager-soft);color:var(--manager-strong);border:1px solid #E2CBA6;}
  .btn{font-family:inherit;font-size:13.5px;font-weight:500;border-radius:8px;padding:7px 14px;cursor:pointer;border:1px solid transparent;transition:transform .08s ease, background .15s ease;}
  .btn:active{transform:translateY(1px);}
  .btn-outline{background:transparent;border-color:var(--line);color:var(--ink);}
  .btn-outline:hover{background:var(--surface-soft);}
  .btn-manager{background:var(--manager);color:#fff;}
  .btn-manager:hover{background:var(--manager-strong);}
  .btn-ghost{background:transparent;border:none;color:var(--ink-soft);text-decoration:underline;padding:4px 2px;font-size:12.5px;cursor:pointer;}
  .btn-small{font-size:12.5px;padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:var(--surface-soft);color:var(--ink);cursor:pointer;}
  .btn-small:hover{background:#EFEAE0;}

  .tabs{max-width:1040px;margin:0 auto;padding:14px 20px 0;display:flex;gap:4px;overflow-x:auto;}
  .tab-btn{font-family:inherit;background:none;border:none;cursor:pointer;padding:10px 14px;font-size:14.5px;color:var(--ink-soft);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500;}
  .tab-btn.active{color:var(--accent-strong);border-bottom-color:var(--accent);}
  .tab-btn:hover{color:var(--accent-strong);}

  main{padding-top:22px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}
  .card h3{font-size:16px;}
  .muted{color:var(--ink-soft);font-size:13px;}
  .note{background:var(--surface-soft);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--ink-soft);margin-bottom:16px;}

  .field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px;}
  .field-grid.wide{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.span2{grid-column:span 2;}
  .field.narrow{max-width:180px;}
  .multi-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);}
  .multi-row:last-child{border-bottom:none;}
  .multi-check{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;}
  .multi-check input{width:16px;height:16px;cursor:pointer;flex-shrink:0;}
  .pct-wrap{display:flex;align-items:center;gap:5px;flex-shrink:0;}
  .pct-wrap input{width:68px;text-align:right;}
  .pct-suffix{font-size:12.5px;color:var(--ink-soft);}
  label{font-size:12.5px;color:var(--ink-soft);font-weight:500;}
  input[type=text],input[type=number],textarea,select{
    font-family:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#fff;width:100%;
  }
  textarea{resize:vertical;min-height:44px;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
  input:disabled,textarea:disabled,select:disabled{
    background:repeating-linear-gradient(135deg,#F1EEE6,#F1EEE6 6px,#EAE5D8 6px,#EAE5D8 12px);
    color:#8b8879;cursor:not-allowed;border-color:#E3DDCB;
  }

  .section-label{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-size:13px;font-weight:700;color:var(--ink-soft);flex-wrap:wrap;}
  .section-hint{font-size:12px;color:var(--ink-soft);margin:-4px 0 8px;}
  .tag{font-size:11px;font-weight:500;padding:2px 8px;border-radius:100px;}
  .tag.self{background:var(--accent-soft);color:var(--accent-strong);}
  .tag.mgr{background:var(--manager-soft);color:var(--manager-strong);}
  .tag.auto{background:#EDEAE0;color:var(--ink-soft);}

  details.day{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:var(--surface);overflow:hidden;}
  details.day[open]{border-color:#C9C2AC;}
  summary.day-sum{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:14px;justify-content:space-between;}
  summary.day-sum::-webkit-details-marker{display:none;}
  .day-sum-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .day-date{font-weight:700;font-size:14.5px;min-width:60px;}
  .day-weekday{font-size:12.5px;color:var(--ink-soft);background:var(--surface-soft);padding:2px 9px;border-radius:100px;}
  .day-summary-text{font-size:13px;color:var(--ink-soft);}
  .day-body{padding:6px 16px 20px;border-top:1px solid var(--line);}
  .chevron{transition:transform .15s ease;color:var(--ink-soft);}
  details[open] .chevron{transform:rotate(90deg);}

  /* time bar */
  .timebar-wrap{overflow-x:auto;padding-bottom:4px;}
  .timebar-row{display:flex;gap:2px;width:max-content;}
  .slot{width:19px;height:30px;flex:0 0 19px;border:1px solid var(--line);border-radius:3px;background:#fff;cursor:pointer;touch-action:none;}
  .slot:hover{border-color:var(--accent);}
  .slot.on{background:var(--accent);border-color:var(--accent-strong);}
  .timebar-labels{display:flex;gap:2px;width:max-content;margin-top:3px;}
  .timebar-labels span{width:19px;flex:0 0 19px;font-size:9px;color:var(--ink-soft);}
  .timebar-summary{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;align-items:baseline;}
  .timebar-summary .item{font-size:13px;}
  .timebar-summary .num{font-weight:700;color:var(--accent-strong);}

  /* task rows */
  .task-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .task-row input[type=text]{flex:1;}
  .star-wrap,.done-wrap{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--ink-soft);white-space:nowrap;cursor:pointer;}
  .star-wrap input,.done-wrap input{width:15px;height:15px;cursor:pointer;}
  .star-ico{font-size:15px;color:#C9C2AC;}
  .star-wrap input:checked ~ .star-ico{color:#C7902E;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:15px;padding:4px 7px;border-radius:6px;line-height:1;}
  .icon-btn:hover{background:var(--surface-soft);color:var(--danger);}
  .add-row-btn{margin-top:2px;}
  .empty-hint{font-size:13px;color:var(--ink-soft);font-style:normal;padding:8px 0;}

  .echo-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:7px;}
  .echo-text{
    flex:0 0 220px;font-size:13px;padding:8px 10px;background:var(--surface-soft);
    border:1px solid var(--line);border-radius:7px;color:var(--ink-soft);
  }
  .echo-text.important{border-color:#E2CBA6;color:var(--manager-strong);background:#FBF4E9;}
  .echo-row .rest{flex:1;display:flex;gap:8px;flex-wrap:wrap;}
  .echo-row select{max-width:220px;}

  /* weekly */
  .week-card{border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:18px;background:var(--surface);}
  .week-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap;}
  .week-head h3{margin:0;}
  .score-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px;}
  .score-table th,.score-table td{border:1px solid var(--line);padding:8px 10px;text-align:center;}
  .score-table th{background:var(--surface-soft);font-weight:500;color:var(--ink-soft);font-size:12.5px;}
  .score-table td.total{font-weight:700;color:var(--accent-strong);background:var(--accent-soft);}
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0 4px;}
  .stat{background:var(--surface-soft);border-radius:8px;padding:10px 12px;}
  .stat .num{font-size:19px;font-weight:700;color:var(--accent-strong);font-family:"Noto Serif TC",serif;}
  .stat .lab{font-size:11.5px;color:var(--ink-soft);}
  .rating-note{font-size:12px;color:var(--ink-soft);margin:4px 0 6px;}

  .weight-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .weight-row .lab{width:150px;font-size:13px;flex-shrink:0;}
  .weight-bar-bg{flex:1;background:var(--surface-soft);border-radius:100px;height:10px;overflow:hidden;}
  .weight-bar-fill{height:100%;background:var(--accent);border-radius:100px;}
  .weight-row .val{width:34px;text-align:right;font-size:12.5px;color:var(--ink-soft);font-weight:600;}

  .reason-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:6px;}
  .reason-item{background:var(--surface-soft);border-radius:8px;padding:9px 12px;font-size:13px;}
  .reason-item b{color:var(--accent-strong);}

  table.ref{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
  table.ref th,table.ref td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;}
  table.ref th{background:var(--surface-soft);font-weight:600;color:var(--ink-soft);}

  .lock-hint{font-size:12px;color:var(--manager-strong);display:flex;align-items:center;gap:5px;margin-top:2px;}

  .modal-bg{position:fixed;inset:0;background:rgba(30,28,20,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff;border-radius:12px;padding:24px 26px;max-width:340px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.2);}
  .modal h3{margin-bottom:6px;}
  .modal p{font-size:13px;color:var(--ink-soft);margin-top:0;}
  .modal input{margin:10px 0 14px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;}
  .modal-error{color:var(--danger);font-size:12.5px;margin:-8px 0 10px;display:none;}

  .save-indicator{position:fixed;bottom:18px;right:18px;background:var(--accent-strong);color:#fff;padding:8px 16px;border-radius:100px;font-size:12.5px;opacity:0;transform:translateY(6px);transition:opacity .25s ease, transform .25s ease;z-index:40;pointer-events:none;}
  .save-indicator.show{opacity:1;transform:translateY(0);}

  footer{max-width:1040px;margin:30px auto 0;padding:0 20px;color:var(--ink-soft);font-size:12px;}

  @media (max-width:640px){
    .day-sum-left{flex-wrap:wrap;}
    .field.span2{grid-column:span 1;}
    .echo-text{flex-basis:140px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="title-block">
      <h1 id="pageTitle">工作習慣養成追蹤系統</h1>
      <p>每日覆盤 ＋ 月度追蹤</p>
      <div style="margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <label style="font-size:12.5px;color:var(--ink-soft);">目前檢視同仁：</label>
        <select id="empSelect" style="max-width:220px;"></select>
        <label style="font-size:12.5px;color:var(--ink-soft);margin-left:6px;">月份：</label>
        <select id="monthSelect" style="max-width:140px;"></select>
        <button class="btn-small" id="addMonthBtn" title="新增下一個月份的設定">＋新增下個月</button>
      </div>
    </div>
    <div class="auth-block">
      <span id="modePill" class="mode-pill view">🔒 檢視模式</span>
      <div>
        <button class="btn btn-outline" id="loginBtn">主管登入</button>
        <button class="btn btn-outline" id="logoutBtn" style="display:none;">登出主管模式</button>
      </div>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="intro">使用說明</button>
    <button class="tab-btn" data-tab="daily">每日紀錄</button>
    <button class="tab-btn" data-tab="weekly">每週檢核</button>
    <button class="tab-btn" data-tab="mgrlog">主管覆盤紀錄</button>
    <button class="tab-btn" data-tab="summary">月底總結</button>
  </div>
</div>

<div class="wrap">
  <main id="app">
    <div class="card muted">資料載入中…</div>
  </main>
</div>

<footer>
  資料會即時儲存，並與所有開啟此頁面的人共用同一份紀錄；建議固定用同一個連結／同一台裝置操作。主管專用欄位需要主管登入後才能編輯。
</footer>

<div class="modal-bg" id="loginModal">
  <div class="modal">
    <h3>主管登入</h3>
    <p>輸入主管密碼以解鎖主管專用欄位。</p>
    <div class="modal-error" id="loginError">密碼不正確，請再試一次。</div>
    <input type="password" id="pinInput" placeholder="請輸入密碼" autocomplete="off">
    <div class="modal-actions">
      <button class="btn btn-outline" id="loginCancel">取消</button>
      <button class="btn btn-manager" id="loginSubmit">登入</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="pinModal">
  <div class="modal">
    <h3>變更主管密碼</h3>
    <p>設定新的主管登入密碼（至少4碼）。</p>
    <div class="modal-error" id="pinError">密碼至少需要4碼。</div>
    <input type="password" id="newPinInput" placeholder="新密碼" autocomplete="off">
    <div class="modal-actions">
      <button class="btn btn-outline" id="pinCancel">取消</button>
      <button class="btn btn-manager" id="pinSubmit">儲存新密碼</button>
    </div>
  </div>
</div>

<div class="save-indicator" id="saveIndicator">已儲存</div>

<script>
/* =========================================================
   常數
   ========================================================= */
const WEEKDAY_ZH = ['週日','週一','週二','週三','週四','週五','週六'];

// 與原始 Excel 資料驗證清單完全一致
const REASON_OPTIONS = [
  {v:'', t:'（請選擇）'},
  {v:'A 真正不可抗力', t:'A　真正不可抗力'},
  {v:'B 家庭安排未事先處理', t:'B　家庭安排未事先處理'},
  {v:'C 拖延／逃避', t:'C　拖延／逃避'},
  {v:'D 能力／方法不足', t:'D　能力／方法不足'},
  {v:'無', t:'無'},
];
const YESNO_OPTIONS = [{v:'',t:'（請選擇）'},{v:'是',t:'是'},{v:'否',t:'否'}];
const YNP_OPTIONS = [{v:'',t:'（請選擇）'},{v:'是',t:'是'},{v:'部分',t:'部分'},{v:'否',t:'否'}];

// 未完成主因（複選＋可輸入佔比%）
const MAIN_REASON_KEYS = [
  {key:'A', label:'A　真正不可抗力'},
  {key:'B', label:'B　家庭安排未事先處理'},
  {key:'C', label:'C　拖延／逃避'},
  {key:'D', label:'D　能力／方法不足'},
  {key:'N', label:'無'},
];
// 覆盤時的第一反應（複選＋可輸入佔比%；「其他」改為「靜默」）
const REACTION_KEYS = [
  {key:'R1', label:'先說做不到／不知道'},
  {key:'R2', label:'先描述問題'},
  {key:'R3', label:'先提出解法'},
  {key:'R4', label:'靜默'},
];

const SLOT_START_HOUR = 7;   // 時間條從 07:00 開始
const SLOT_MINUTES = 30;     // 每格 30 分鐘
const SLOT_COUNT = 32;       // 07:00–23:00 共 16 小時

function lastDayOfMonth(year, month){ return new Date(year, month, 0).getDate(); }
// 與後端 buildWeeks 相同的演算法：把某月的起訖日切成「以週日結尾」的週次，確保前後端週次編號一致
function buildWeekRanges(year, month, startDay, endDay){
  const weeks = [];
  let cursor = startDay, weekNum = 1;
  while(cursor <= endDay){
    const d = new Date(year, month-1, cursor);
    const daysUntilSunday = (7 - d.getDay()) % 7;
    const weekEnd = Math.min(cursor + daysUntilSunday, endDay);
    weeks.push({num:weekNum, startDay:cursor, endDay:weekEnd});
    cursor = weekEnd + 1;
    weekNum++;
  }
  return weeks;
}
function buildDailyDates(year, month, startDay, endDay){
  const list = [];
  for(let d=startDay; d<=endDay; d++){
    const dateObj = new Date(year, month-1, d);
    const key = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    list.push({key, day:d, weekday: WEEKDAY_ZH[dateObj.getDay()]});
  }
  return list;
}
let ALL_DAYS = [];
let WEEKS = [];
function rebuildDateStructures(){
  const [y,m] = currentMonth.split('-').map(Number);
  const startDay = (currentMonthConfig && currentMonthConfig.startDay) || 1;
  const endDay = lastDayOfMonth(y,m);
  ALL_DAYS = buildDailyDates(y,m,startDay,endDay);
  const ranges = buildWeekRanges(y,m,startDay,endDay);
  WEEKS = ranges.map(r=>{
    const days = ALL_DAYS.filter(d=> d.day>=r.startDay && d.day<=r.endDay).map(d=>d.key);
    return { num:r.num, label:`第${r.num}週`, period:`${m}/${r.startDay}–${m}/${r.endDay}`, days };
  });
}

const RATING_NOTE = '評分說明：1=幾乎未做到｜2=偶爾做到｜3=約一半穩定｜4=大多做到｜5=穩定做到';

/* =========================================================
   狀態管理
   ========================================================= */
// 注意：這個網頁現在直接跑在Apps Script專案裡（Index.html），
// 用 google.script.run 直接呼叫Code.gs裡的函式，不再需要API網址或fetch。

let STATE = { daily:{}, weekly:{}, mgrlog:{}, summary:{ metrics:{}, questions:{} } };
let EMPLOYEES = [];
let currentEmployee = localStorage.getItem('emp-id') || '';
let MONTHS = [];                    // 所有已設定的月份（來自「月度設定」分頁）
let currentMonth = localStorage.getItem('cur-month') || '2026-09';
let currentMonthConfig = null;      // 目前月份的目的/核心目標/建議權重/起始日
let managerMode = false;
let currentTab = 'intro';

// 每週檢核／主管覆盤紀錄／9月底總結 的內部欄位名稱 → 試算表實際表頭文字
const WEEKLY_HEADERS = {
  selfStability:'本人自評-時間穩定', selfExecution:'本人自評-執行力', selfInitiative:'本人自評-主動性',
  selfLearning:'本人自評-學習投入', selfReflection:'本人自評-覆盤覺察',
  mgrStability:'主管評-時間穩定', mgrExecution:'主管評-執行力', mgrInitiative:'主管評-主動性',
  mgrLearning:'主管評-學習投入', mgrReflection:'主管評-覆盤覺察',
  mainIssue:'本週最主要問題', nextAdjust:'下週只調整一件事',
};
const MGRLOG_REASON_HEADERS = {
  A:['主因_A真正不可抗力_勾選','主因_A真正不可抗力_佔比%'],
  B:['主因_B家庭安排未事先處理_勾選','主因_B家庭安排未事先處理_佔比%'],
  C:['主因_C拖延逃避_勾選','主因_C拖延逃避_佔比%'],

function ensureShapes(){
  ALL_DAYS.forEach(d=>{
    if(!STATE.daily[d.key]) STATE.daily[d.key] = {};
    if(!STATE.daily[d.key].tasks) STATE.daily[d.key].tasks = {};
    if(!STATE.daily[d.key].tomorrow) STATE.daily[d.key].tomorrow = {};
    if(!STATE.daily[d.key].timeSlots || STATE.daily[d.key].timeSlots.length !== SLOT_COUNT){
      STATE.daily[d.key].timeSlots = new Array(SLOT_COUNT).fill(false);
    }
  });
  WEEKS.forEach(w=>{ if(!STATE.weekly[w.num]) STATE.weekly[w.num] = {}; });
  ALL_DAYS.forEach(d=>{ if(!STATE.mgrlog[d.key]) STATE.mgrlog[d.key] = {}; });
  if(!STATE.summary) STATE.summary = {metrics:{}, questions:{}};
  if(!STATE.summary.metrics) STATE.summary.metrics = {};
  if(!STATE.summary.questions) STATE.summary.questions = {};
}

function getPath(obj, path, fallback){
  const parts = path.split('.');
  let node = obj;
  for(const p of parts){
    if(node == null) return fallback;
    node = node[p];
  }
  return (node === undefined || node === null) ? fallback : node;
}
function setPath(obj, path, value){
  const parts = path.split('.');
  let node = obj;
  for(let i=0;i<parts.length-1;i++){
    if(!node[parts[i]] || typeof node[parts[i]] !== 'object') node[parts[i]] = {};
    node = node[parts[i]];
  }
  node[parts[parts.length-1]] = value;
}
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function escapeHTML(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escapeAttr(s){ return escapeHTML(s); }

/* =========================================================
   Apps Script 橋接（google.script.run，不用fetch，沒有CORS問題）
   ========================================================= */
function gsRun(fnName, ...args){
  return new Promise((resolve, reject)=>{
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(err=> reject(err))
      [fnName](...args);
  });
}

/* ---- 儲存：每個範圍各自debounce，避免整包資料每次都重寫 ---- */
const saveTimers = {};
function debounce(key, fn, delay=700){
  showSaveIndicator('儲存中…');
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(async ()=>{
    try{ await fn(); showSaveIndicator('已儲存'); }
    catch(e){ showSaveIndicator('儲存失敗，請檢查網路'); }
  }, delay);
}

function readBind(bind){
  if(bind.startsWith('monthcfg.')) return getPath(currentMonthConfig, bind.slice(9), '');
  return getPath(STATE, bind, '');
}
function writeBind(bind, val){
  if(bind.startsWith('monthcfg.')) setPath(currentMonthConfig, bind.slice(9), val);

function fieldHTML({label, bind, type='text', locked=false, span2=false, options=null, rows=null, narrow=false}){
  const disabledAttr = locked && !managerMode ? 'disabled' : '';
  const val = readBind(bind);
  let control = '';
  if(type === 'textarea'){
    control = `<textarea data-bind="${bind}" ${disabledAttr} rows="${rows||2}">${escapeHTML(val)}</textarea>`;
  } else if(type === 'select'){
    const opts = options.map(o=>`<option value="${escapeAttr(o.v)}" ${o.v===val?'selected':''}>${escapeHTML(o.t)}</option>`).join('');
    control = `<select data-bind="${bind}" ${disabledAttr}>${opts}</select>`;
  } else if(type === 'number'){
    control = `<input type="number" data-bind="${bind}" data-type="number" value="${val===''?'':val}" ${disabledAttr} step="0.5">`;
  } else {
    control = `<input type="text" data-bind="${bind}" value="${escapeAttr(val)}" ${disabledAttr}>`;
  }
  return `<div class="field ${span2?'span2':''} ${narrow?'narrow':''}">${label?`<label>${label}</label>`:''}${control}</div>`;
}

/* =========================================================
   每日紀錄：資料輔助
   ========================================================= */
function getSlots(day){
  const r = STATE.daily[day];
  if(!r.timeSlots || r.timeSlots.length !== SLOT_COUNT) r.timeSlots = new Array(SLOT_COUNT).fill(false);
  return r.timeSlots;
}
function slotTimeLabel(i){
  const totalMin = SLOT_START_HOUR*60 + i*SLOT_MINUTES;
  const h = Math.floor(totalMin/60), m = totalMin%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function slotsToRangesText(slots){
  const ranges = [];
  let start = null;
  for(let i=0;i<slots.length;i++){
    if(slots[i] && start===null) start = i;
    if(!slots[i] && start!==null){ ranges.push([start,i]); start=null; }
  }
  if(start!==null) ranges.push([start, slots.length]);
  if(ranges.length===0) return '尚未選擇時段';
  return ranges.map(([s,e])=>`${slotTimeLabel(s)}–${slotTimeLabel(e)}`).join('、');
}
function plannedHoursFromSlots(slots){
  return slots.filter(Boolean).length * (SLOT_MINUTES/60);
}
function dayTasks(rec){ return Object.entries(rec.tasks||{}).map(([id,t])=>({id, text:'', important:false, done:false, reason:'', reasonCategory:'', stuck:'', ...t})); }
function dayTomorrow(rec){ return Object.entries(rec.tomorrow||{}).map(([id,t])=>({id, text:'', ...t})); }
function newId(){ return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function addTask(day){
  const rec = STATE.daily[day];
  if(!rec.tasks) rec.tasks = {};
  rec.tasks[newId()] = {text:'', important:false, done:false, reason:'', reasonCategory:'', stuck:''};
  saveDailyDay(day);
  refreshDayUI(day);
}
function delTask(day, id){
  const rec = STATE.daily[day];
  if(rec.tasks) delete rec.tasks[id];
  saveDailyDay(day);
  refreshDayUI(day);
}
function addTomorrow(day){
  const rec = STATE.daily[day];
  if(!rec.tomorrow) rec.tomorrow = {};
  rec.tomorrow[newId()] = {text:''};
  saveDailyDay(day);
  refreshDayUI(day);
}
function delTomorrow(day, id){
  const rec = STATE.daily[day];
  if(rec.tomorrow) delete rec.tomorrow[id];
  saveDailyDay(day);
  refreshDayUI(day);
}

function dailySummaryText(rec){
  const bits = [];
  const plannedH = plannedHoursFromSlots(rec.timeSlots || []);
  if(plannedH || rec.actualHours) bits.push(`時數 ${rec.actualHours || 0}/${plannedH}`);
  const tasks = dayTasks(rec);
  if(tasks.length) bits.push(`任務 ${tasks.filter(t=>t.done).length}/${tasks.length}`);
  return bits.length ? bits.join(' · ') : '尚未填寫';
}

function computeWeekObjective(w){
  let plannedHours=0, actualHours=0, plannedTasks=0, completedTasks=0;
  w.days.forEach(k=>{
    const r = STATE.daily[k] || {};
    plannedHours += plannedHoursFromSlots(r.timeSlots || []);
    actualHours += num(r.actualHours);
    const tasks = dayTasks(r);
    plannedTasks += tasks.length;
    completedTasks += tasks.filter(t=>t.done).length;
  });
  const hoursRate = plannedHours>0 ? Math.min(actualHours/plannedHours,1) : 0;
  const taskRate = plannedTasks>0 ? Math.min(completedTasks/plannedTasks,1) : 0;
  return {plannedHours,actualHours,hoursRate,plannedTasks,completedTasks,taskRate};
}
function computeWeekScores(w){
  const obj = computeWeekObjective(w);
  const wk = STATE.weekly[w.num] || {};
  const objHours = obj.hoursRate*30;
  const objTasks = obj.taskRate*25;
  const selfSubj = (num(wk.selfInitiative)/5*20)+(num(wk.selfLearning)/5*15)+(num(wk.selfReflection)/5*10);
  const mgrSubj = (num(wk.mgrInitiative)/5*20)+(num(wk.mgrLearning)/5*15)+(num(wk.mgrReflection)/5*10);
  const mgrTotal = objHours+objTasks+mgrSubj;
  return {obj, objHours, objTasks, selfSubj, mgrSubj, mgrTotal};
}
function pct(n){ return (n*100).toFixed(0)+'%'; }
function fix1(n){ return (Math.round(n*10)/10).toString(); }

function computeMonthSummary(){
  let plannedHours=0, actualHours=0, plannedTasks=0, completedTasks=0;
  let callDone=0, cntA=0, cntB=0, cntC=0, cntD=0;
  ALL_DAYS.forEach(d=>{
    const r = STATE.daily[d.key] || {};
    plannedHours += plannedHoursFromSlots(r.timeSlots || []);
    actualHours += num(r.actualHours);
    const tasks = dayTasks(r);
    plannedTasks += tasks.length;
    completedTasks += tasks.filter(t=>t.done).length;
    if(r.callReview === '是') callDone++;
    tasks.forEach(t=>{
      const c = t.reasonCategory || '';
      if(c.startsWith('A')) cntA++;
      if(c.startsWith('B')) cntB++;
      if(c.startsWith('C')) cntC++;
      if(c.startsWith('D')) cntD++;
    });
  });
  const hoursRate = plannedHours>0 ? actualHours/plannedHours : 0;
  const taskRate = plannedTasks>0 ? completedTasks/plannedTasks : 0;
  const callRate = callDone/ALL_DAYS.length;
  return {plannedHours,actualHours,hoursRate,plannedTasks,completedTasks,taskRate,callRate,cntA,cntB,cntC,cntD};
}

  if(bind.startsWith('daily.')) saveDailyDay(bind.split('.')[1]);
  else if(bind.startsWith('weekly.')) saveWeeklyWeek(bind.split('.')[1]);
  else if(bind.startsWith('mgrlog.')) saveMgrLogDay(bind.split('.')[1]);
  else if(bind.startsWith('summary.')) saveSummary();
  else if(bind.startsWith('monthcfg.')) saveMonthConfigNow();
}

function handleFieldEvent(e){
  const el = e.target.closest('[data-bind]');
  if(!el || el.disabled) return;
  const isCheckbox = el.type === 'checkbox';
  const isSelect = el.tagName === 'SELECT';
  if(isCheckbox && e.type !== 'change') return;
  if(isSelect && e.type !== 'change') return;
  if(!isCheckbox && !isSelect && e.type !== 'input') return;

  const bind = el.dataset.bind;
  let val;
  if(isCheckbox) val = el.checked;
  else if(el.dataset.type === 'number') val = el.value === '' ? '' : parseFloat(el.value);
  else val = el.value;
  writeBind(bind, val);
  dispatchSave(bind);

  if(isCheckbox && bind.startsWith('daily.')){
    const day = bind.split('.')[1];
    refreshDayUI(day);
    return;
  }
  const echoMatch = bind.match(/^daily\.([^.]+)\.tasks\.([^.]+)\.text$/);
  if(echoMatch){
    const [, day, id] = echoMatch;
    document.querySelectorAll(`[data-echo-day="${day}"][data-echo-task="${id}"]`).forEach(n=>{
      n.textContent = el.value || '（未命名任務）';
    });
  }
  if(currentTab === 'weekly'){
    const m2 = bind.match(/^weekly\.(\d+)\.(self|mgr)/);
    if(m2) updateWeekScoreDisplay(m2[1]);
  }
}
document.getElementById('app').addEventListener('input', handleFieldEvent);
document.getElementById('app').addEventListener('change', handleFieldEvent);

document.getElementById('app').addEventListener('click', e=>{
  const addT = e.target.closest('[data-action="add-task"]');
  if(addT){ addTask(addT.dataset.day); return; }
  const delT = e.target.closest('[data-action="del-task"]');
  if(delT){ delTask(delT.dataset.day, delT.dataset.taskId); return; }
  const addM = e.target.closest('[data-action="add-tmr"]');
  if(addM){ addTomorrow(addM.dataset.day); return; }
  const delM = e.target.closest('[data-action="del-tmr"]');
  if(delM){ delTomorrow(delM.dataset.day, delM.dataset.taskId); return; }
});

/* time bar painting */
let paint = null;
document.getElementById('app').addEventListener('pointerdown', e=>{
  const cell = e.target.closest('.slot');
  if(!cell) return;
  e.preventDefault();
  const day = cell.dataset.day;
  const idx = Number(cell.dataset.idx);
  const slots = getSlots(day);
  const newVal = !slots[idx];
  slots[idx] = newVal;
  cell.classList.toggle('on', newVal);
  paint = {day, value:newVal};
  updateTimeSummary(day);
  saveDailyDay(day);
});
document.getElementById('app').addEventListener('pointerover', e=>{
  if(!paint) return;
  if(e.buttons !== 1){ paint = null; return; }
  const cell = e.target.closest('.slot');
  if(!cell || cell.dataset.day !== paint.day) return;
  const idx = Number(cell.dataset.idx);
  const slots = getSlots(paint.day);
  if(slots[idx] !== paint.value){
    slots[idx] = paint.value;
    cell.classList.toggle('on', paint.value);
    updateTimeSummary(paint.day);
    saveDailyDay(paint.day);
  }
});
window.addEventListener('pointerup', ()=>{ paint = null; });

/* login modal */
const loginModal = document.getElementById('loginModal');
const pinInput = document.getElementById('pinInput');
const loginError = document.getElementById('loginError');
let sessionPin = null; // 記住這次登入用的密碼，變更密碼時要驗證舊密碼會用到
document.getElementById('loginBtn').addEventListener('click', ()=>{
  loginError.style.display = 'none';
  pinInput.value = '';
  loginModal.classList.add('show');
  setTimeout(()=>pinInput.focus(), 50);
});
document.getElementById('loginCancel').addEventListener('click', ()=> loginModal.classList.remove('show'));
loginModal.addEventListener('click', e=>{ if(e.target === loginModal) loginModal.classList.remove('show'); });
async function attemptLogin(){
  const btn = document.getElementById('loginSubmit');
  btn.disabled = true;
  try{
    const res = await gsRun('checkPin', pinInput.value);
    if(res && res.ok && res.valid){
      managerMode = true;
      sessionPin = pinInput.value;
      loginModal.classList.remove('show');
      updateModeUI();
      renderTab(currentTab);
    } else {
      loginError.textContent = '密碼不正確，請再試一次。';
      loginError.style.display = 'block';
    }
  }catch(e){
    loginError.textContent = '無法連線到伺服器，請檢查網路後再試一次。';
    loginError.style.display = 'block';
  }
  btn.disabled = false;
}
document.getElementById('loginSubmit').addEventListener('click', attemptLogin);
pinInput.addEventListener('keydown', e=>{ if(e.key==='Enter') attemptLogin(); });
document.getElementById('logoutBtn').addEventListener('click', ()=>{
  managerMode = false;
  sessionPin = null;
  updateModeUI();
  renderTab(currentTab);
});

const newPinInput = document.getElementById('newPinInput');
const pinError = document.getElementById('pinError');

  if(newPinInput.value.length < 4){ pinError.textContent='密碼至少需要4碼。'; pinError.style.display='block'; return; }
  try{

/* 同仁選擇器 */
function renderEmployeeSelect(){
  const sel = document.getElementById('empSelect');
  if(EMPLOYEES.length === 0){
    sel.innerHTML = `<option value="">（尚無同仁資料，請先在「同仁名單」分頁新增）</option>`;
    return;
  }
  sel.innerHTML = EMPLOYEES.map(emp=>
    `<option value="${escapeAttr(emp.id)}" ${emp.id===currentEmployee?'selected':''}>${escapeHTML(emp.name)}（${escapeHTML(emp.id)}）</option>`
  ).join('');
}
document.getElementById('empSelect').addEventListener('change', async e=>{
  currentEmployee = e.target.value;
  localStorage.setItem('emp-id', currentEmployee);
  document.getElementById('app').innerHTML = `<div class="card muted">切換同仁資料載入中…</div>`;
  await loadEmployeeState(currentEmployee);
  renderMonthSelect();
  renderTab(currentTab);
});

/* 月份選擇器 */
function renderMonthSelect(){
  const sel = document.getElementById('monthSelect');
  if(MONTHS.length === 0){
    sel.innerHTML = `<option value="${escapeAttr(currentMonth)}">${escapeAttr(currentMonth)}</option>`;
    return;
  }
  const sorted = [...MONTHS].sort((a,b)=> a.month<b.month?-1:1);
  sel.innerHTML = sorted.map(m=>
    `<option value="${escapeAttr(m.month)}" ${m.month===currentMonth?'selected':''}>${escapeAttr(m.month)}</option>`
  ).join('');
}
document.getElementById('monthSelect').addEventListener('change', e=>{
  switchMonth(e.target.value);
  renderTab(currentTab);
});
function nextMonthStr(monthStr){
  const [y,m] = monthStr.split('-').map(Number);
  const ny = m===12 ? y+1 : y;
  const nm = m===12 ? 1 : m+1;
  return `${ny}-${String(nm).padStart(2,'0')}`;
}
document.getElementById('addMonthBtn').addEventListener('click', async ()=>{
  if(!managerMode){
    alert('請先以主管身分登入，才能新增下個月的設定。');
    return;
  }
  const latest = MONTHS.map(m=>m.month).sort().slice(-1)[0] || currentMonth;
  const nm = nextMonthStr(latest);
  if(MONTHS.some(m=>m.month===nm)){
    switchMonth(nm);
    renderMonthSelect();
    renderTab(currentTab);
    return;
  }
  const defaultWeights = {hours:30,tasks:25,initiative:20,learning:15,reflection:10};
  await gsRun('saveMonthConfig', nm, {
    '起始日': 1, '現階段目的':'', '月份核心目標':'',
    '建議時數權重':30,'建議任務權重':25,'建議主動性權重':20,'建議學習投入權重':15,'建議覆盤覺察權重':10,
  });
  MONTHS.push({ month:nm, startDay:1, purpose:'', coreGoal:'', weights:defaultWeights });
  switchMonth(nm);
  renderMonthSelect();
  renderTab(currentTab);
});

   啟動
   ========================================================= */
(async function init(){
  try{
    await loadEmployeeList();
  }catch(e){
    document.getElementById('app').innerHTML = `<div class="card">⚠️ 無法連線到試算表後端，請檢查網路連線，或稍後重新整理頁面再試一次。</div>`;
    return;
  }
  if(!currentEmployee || !EMPLOYEES.some(emp=>emp.id===currentEmployee)){
    currentEmployee = EMPLOYEES[0] ? EMPLOYEES[0].id : '';
  }
  renderEmployeeSelect();
  if(currentEmployee){
    await loadEmployeeState(currentEmployee);
  } else {
    rebuildDateStructures();
    ensureShapes();
    updatePageTitle();
  }
  renderMonthSelect();
  updateModeUI();
  renderTab('intro');
})();
</script>
